<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Xibolete</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#141a26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xibolete">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Aprenda inglês, espanhol, francês, italiano e russo jogando e falando em voz alta: pronúncia corrigida por reconhecimento de voz, XP, níveis, sequência e conquistas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: sticky stat bar on top; left nav (bottom bar on phones), a center column holding the
   zig-zag lesson path, and a right rail with today's goal, quests and level on wide screens.
   Lessons open as a full-screen overlay with a feedback footer, like a game round. */
:root{
  --bg:#f5f7f2; --surface:#ffffff; --surface-2:#eef1ec; --ink:#1c2230; --muted:#667080; --line:#e1e5de; --line-2:#c9d0c6;
  --lang:#3d6ee8; --lang-dark:#2a51b5;
  --ok:#3aa935; --ok-dark:#2a8526; --ok-soft:#e2f5de; --ok-ink:#1f6b1c;
  --bad:#e5484d; --bad-dark:#b8292e; --bad-soft:#fde5e5; --bad-ink:#a5222a;
  --xp:#e99a00; --coin:#0ea5bd; --heart:#ef3f5a; --flame:#ff7a1a;
  --gold:#f5b800; --gold-dark:#c99400; --locked:#d9ded6; --locked-dark:#bcc3b8; --locked-ink:#8a9386;
  --shadow:0 10px 30px rgba(20,30,20,.12);
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151c; --surface:#18202a; --surface-2:#212a36; --ink:#e9eef5; --muted:#97a2b4; --line:#28323e; --line-2:#37434f;
  --ok:#55c250; --ok-dark:#3a9a36; --ok-soft:#16301b; --ok-ink:#8ee08a;
  --bad:#f0595e; --bad-dark:#b8323a; --bad-soft:#3a1c20; --bad-ink:#ff9a9d;
  --locked:#2b3541; --locked-dark:#1f2731; --locked-ink:#6f7b8a; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#18202a; --surface-2:#212a36; --ink:#e9eef5; --muted:#97a2b4; --line:#28323e; --line-2:#37434f;
  --ok:#55c250; --ok-dark:#3a9a36; --ok-soft:#16301b; --ok-ink:#8ee08a;
  --bad:#f0595e; --bad-dark:#b8323a; --bad-soft:#3a1c20; --bad-ink:#ff9a9d;
  --locked:#2b3541; --locked-dark:#1f2731; --locked-ink:#6f7b8a; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--lang);outline-offset:2px}
svg.i{width:1em;height:1em;flex:none;vertical-align:-.12em}
svg.i.tower,svg.i.tower-big{width:120px;height:120px;display:block;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 3D game buttons */
.btn{--c:var(--lang);--cd:var(--lang-dark);--ci:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;
  background:var(--c);color:var(--ci);box-shadow:0 4px 0 var(--cd);padding:12px 20px;font-family:var(--display);font-weight:600;font-size:17px;
  letter-spacing:.02em;text-transform:uppercase;transition:transform .06s,box-shadow .06s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cd)}
.btn[disabled]{--c:var(--locked);--cd:var(--locked-dark);--ci:var(--locked-ink);cursor:default;filter:none}
.btn[disabled]:active{transform:none;box-shadow:0 4px 0 var(--cd)}
.btn.ok{--c:var(--ok);--cd:var(--ok-dark)}
.btn.bad{--c:var(--bad);--cd:var(--bad-dark)}
.btn.gold{--c:var(--gold);--cd:var(--gold-dark);--ci:#3b2a00}
.btn.ghost{--c:var(--surface);--cd:var(--line-2);--ci:var(--ink);border:2px solid var(--line-2);box-shadow:0 3px 0 var(--line-2)}
.btn.small{padding:8px 14px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.linkish{border:0;background:none;color:var(--muted);font-weight:700;padding:6px 8px;border-radius:8px}
.linkish:hover{color:var(--ink);background:var(--surface-2)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:2px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:31}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.logo{font-family:var(--display);font-weight:700;font-size:26px;color:var(--lang);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo svg{width:28px;height:28px}
.lang-wrap{position:relative}
.lang-btn{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:5px 10px 5px 6px;font-weight:800}
.lang-btn:hover{background:var(--surface-2)}
.badge{display:inline-grid;place-items:center;width:30px;height:22px;border-radius:6px;background:var(--bc,var(--lang));color:#fff;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.04em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.lang-menu{position:absolute;top:calc(100% + 8px);left:0;background:var(--surface);border:2px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px;min-width:240px;z-index:40}
.lang-menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:10px;padding:9px 10px;text-align:left;font-weight:700}
.lang-menu button:hover,.lang-menu button[aria-current="true"]{background:var(--surface-2)}
.lang-menu .pct{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.stats{margin-left:auto;display:flex;gap:4px;align-items:center}
.stat{display:flex;align-items:center;gap:5px;border:0;background:none;border-radius:10px;padding:6px 8px;font-family:var(--display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.stat:hover{background:var(--surface-2)}
.stat svg{width:22px;height:22px}
.stat.flame{color:var(--flame)} .stat.coin{color:var(--coin)} .stat.heart{color:var(--heart)} .stat.xp{color:var(--xp)}
.stat.flame.off{color:var(--locked-ink)}
.boost-tag{font-size:11px;background:var(--xp);color:#fff;border-radius:6px;padding:1px 5px;margin-left:2px}

/* shell */
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr) 320px;gap:28px;
  padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.nav{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:2px solid transparent;background:none;border-radius:14px;padding:10px 14px;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);text-align:left}
.nav button svg{width:26px;height:26px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{border-color:color-mix(in srgb,var(--lang) 45%,transparent);background:color-mix(in srgb,var(--lang) 12%,var(--surface));color:var(--lang)}
.nav .dot{width:9px;height:9px;border-radius:50%;background:var(--bad);margin-left:auto}
.view{min-width:0;max-width:640px;width:100%;justify-self:center}
.side{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px}
.card h3{font-size:19px;margin-bottom:10px}
.only-narrow{display:none}

/* today strip & goal */
.goal{display:flex;align-items:center;gap:14px}
.ring{width:64px;height:64px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .tr{stroke:var(--surface-2)} .ring .pr{stroke:var(--xp);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:15px;color:var(--xp)}
.goal p{margin:0}
.goal strong{font-family:var(--display);font-weight:600;font-size:18px;display:block}
.bar{height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--xp);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);transition:width .5s}
.bar.lang i{background:var(--lang)}
.quest{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:10px 0;border-top:2px solid var(--line)}
.quest:first-of-type{border-top:0;padding-top:2px}
.quest .qi{grid-row:span 2;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--xp)}
.quest .qi svg{width:22px;height:22px}
.quest.done .qi{background:var(--ok);color:#fff}
.quest span{font-weight:800;font-size:15px}
.quest .row{display:flex;align-items:center;gap:8px}
.quest .row .bar{flex:1;height:12px}
.quest small{color:var(--muted);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.lvl-card{display:flex;align-items:center;gap:14px}
.lvl-num{width:56px;height:56px;border-radius:16px;background:var(--xp);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:26px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15);flex:none}
.lvl-card .meta{flex:1;min-width:0;display:grid;gap:6px}
.lvl-card strong{font-family:var(--display);font-weight:600;font-size:18px}
.lvl-card small{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}

/* learn path */
.unit{margin-bottom:28px}
.unit-banner{background:var(--lang);color:#fff;border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15)}
.unit-banner.locked{background:var(--locked);color:var(--locked-ink)}
.unit-banner .eyebrow{margin:0;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.unit-banner h2{font-size:24px;margin:2px 0}
.unit-banner p{margin:0;opacity:.9;font-weight:700}
.guide-btn{border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:inherit;border-radius:12px;padding:8px 12px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;display:flex;gap:6px;align-items:center;white-space:nowrap}
.guide-btn:hover{background:rgba(255,255,255,.22)}
.unit-banner.locked .guide-btn{border-color:var(--locked-dark)}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding:28px 0 6px}
.node-wrap.has-pop{z-index:10}
.node-wrap{position:relative;z-index:1;transform:translateX(var(--x,0));display:flex;flex-direction:column;align-items:center}
.node{--c:var(--lang);--cd:var(--lang-dark);width:72px;height:66px;border-radius:50%;border:0;background:var(--c);box-shadow:0 7px 0 var(--cd);color:#fff;display:grid;place-items:center;transition:transform .08s,box-shadow .08s;position:relative}
.node svg{width:32px;height:32px}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--cd)}
.node.locked{--c:var(--locked);--cd:var(--locked-dark);color:var(--locked-ink)}
.node.done{--c:var(--gold);--cd:var(--gold-dark);color:#fff}
.node .times{position:absolute;bottom:-4px;right:-6px;background:var(--surface);color:var(--gold-dark);border:2px solid var(--gold);border-radius:99px;font-family:var(--display);font-size:12px;padding:0 6px;line-height:18px}
.node.current::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid color-mix(in srgb,var(--lang) 40%,transparent);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.18);opacity:0}}
.start-tag{position:absolute;bottom:calc(100% + 14px);background:var(--surface);border:2px solid var(--line);color:var(--lang);font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:14px;padding:6px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.4s ease-in-out infinite;pointer-events:none}
.start-tag::after{content:"";position:absolute;left:50%;top:100%;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-5px) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-4px)}}
.node.chest{--c:var(--surface-2);--cd:var(--line-2);color:var(--locked-ink);border-radius:20px;width:76px}
.node.chest.ready{--c:var(--gold);--cd:var(--gold-dark);color:#fff;animation:wiggle 2.4s ease-in-out infinite}
.node.chest.opened{--c:var(--surface-2);--cd:var(--line-2);color:var(--gold-dark);opacity:.75}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-7deg)}90%{transform:rotate(7deg)}95%{transform:rotate(-4deg)}}
.pop{position:absolute;top:calc(100% + 16px);z-index:5;width:min(260px,calc(100vw - 32px));transform:translateX(calc(-1 * var(--x,0px)));background:var(--lang);color:#fff;border-radius:16px;padding:14px;box-shadow:var(--shadow);text-align:left}
.pop.locked{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.pop::before{content:"";position:absolute;left:calc(50% + var(--x,0px));top:-7px;width:14px;height:14px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.pop.locked::before{border-left:2px solid var(--line);border-top:2px solid var(--line);top:-9px}
.pop h4{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 2px}
.pop p{margin:0 0 12px;font-weight:700;opacity:.9;font-size:14px}
.pop .btn{--c:#fff;--cd:rgba(0,0,0,.2);--ci:var(--lang);width:100%}
.course-done{text-align:center;padding:24px}

/* list views */
.page-head{margin-bottom:18px}
.page-head h1{font-size:30px}
.page-head p{margin:4px 0 0;color:var(--muted);font-weight:700;max-width:56ch}
.hero-card{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hero-card .big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;color:var(--lang)}
.hero-card .grow{flex:1;min-width:180px}
.wlist{display:flex;flex-direction:column;margin-top:8px}
.wrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:2px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .w{font-weight:800;overflow-wrap:anywhere}
.wrow .w small{display:block;color:var(--muted);font-weight:700}
.str{display:flex;gap:3px}
.str i{width:10px;height:14px;border-radius:3px;background:var(--surface-2)}
.str i.on{background:var(--lang)}
.say{border:0;background:var(--surface-2);color:var(--lang);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.say:hover{filter:brightness(.97)}
.say svg{width:20px;height:20px}
.empty{border:2px dashed var(--line-2);border-radius:18px;padding:22px;text-align:center;color:var(--muted);font-weight:700}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ach{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:8px;align-content:start}
.ach .medal{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--gold);color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15)}
.ach .medal svg{width:28px;height:28px}
.ach.lock .medal{background:var(--locked);color:var(--locked-ink)}
.ach strong{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.2}
.ach p{margin:0;color:var(--muted);font-weight:700;font-size:14px}
.ach .bar{height:10px}
.ach small{font-weight:800;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.shop-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 0;border-top:2px solid var(--line)}
.shop-item:first-child{border-top:0;padding-top:4px}
.shop-item .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15)}
.shop-item .ic svg{width:30px;height:30px}
.shop-item strong{font-family:var(--display);font-weight:600;font-size:18px}
.shop-item p{margin:2px 0 0;color:var(--muted);font-weight:700;font-size:14px}
.price{display:inline-flex;align-items:center;gap:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:10px;align-items:center}
.tile svg{width:28px;height:28px;flex:none}
.tile b{font-family:var(--display);font-weight:600;font-size:22px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-weight:700;font-size:13px}
.lang-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:2px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.lang-row:first-child{border-top:0}
.lang-row .bar{margin-top:6px;height:10px}
.lang-row small{color:var(--muted);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line-2);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:800}
.chip[aria-pressed="true"]{border-color:var(--lang);background:color-mix(in srgb,var(--lang) 12%,var(--surface));color:var(--lang)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:2px solid var(--line);flex-wrap:wrap}
.set-row:first-of-type{border-top:0}
.set-row p{margin:2px 0 0;color:var(--muted);font-weight:700;font-size:14px}
.switch{width:52px;height:30px;border-radius:99px;border:0;background:var(--locked);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
.stack{display:flex;flex-direction:column;gap:16px}

/* onboarding */
.onb{max-width:760px;margin:0 auto;padding:32px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));text-align:center}
.onb h1{font-size:clamp(32px,6vw,48px);margin:10px 0 6px}
.onb .lead{color:var(--muted);font-weight:700;font-size:18px;margin:0 auto 10px;max-width:46ch}
.onb .onb-note{color:var(--muted);font-weight:700;font-size:14px;margin:0 auto 26px;max-width:52ch}
.story p{margin:0 0 10px;font-weight:700;line-height:1.55}
.story p:last-child{margin:0}
.story b{color:var(--lang)}
.onb-langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:26px}
.onb-lang{border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);border-radius:18px;padding:18px 10px;display:grid;justify-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:18px}
.onb-lang .badge{width:56px;height:40px;font-size:18px;border-radius:10px}
.onb-lang[aria-pressed="true"]{border-color:var(--bc);background:color-mix(in srgb,var(--bc) 10%,var(--surface))}
.onb h2{font-size:20px;margin-bottom:12px}
.onb .chips{justify-content:center;margin-bottom:28px}
.tower{width:120px;height:120px;margin:0 auto}

/* lesson overlay */
.lesson{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.l-top{max-width:760px;width:100%;margin:0 auto;display:flex;align-items:center;gap:14px;padding:18px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.l-top .x{border:0;background:none;color:var(--muted);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.l-top .x:hover{background:var(--surface-2)}
.l-top .x svg{width:26px;height:26px}
.l-top .bar{flex:1;height:16px}
.l-top .bar i{background:var(--ok)}
.l-hearts{display:flex;align-items:center;gap:4px;color:var(--heart);font-family:var(--display);font-weight:600;font-size:18px}
.l-hearts svg{width:26px;height:26px}
.l-hearts.inf{color:var(--coin)}
.l-body{flex:1;overflow-y:auto;overflow-x:hidden}
.l-in{max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;min-height:100%}
.l-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:14px;color:var(--lang)}
.l-tag.retry{color:var(--bad)}
.combo{color:var(--flame);display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-weight:600;font-size:15px;margin-left:auto;animation:pop .3s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.l-q{font-size:clamp(22px,4vw,28px)}
.prompt{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.prompt .word{font-family:var(--display);font-weight:600;font-size:clamp(30px,7vw,44px);line-height:1.1;overflow-wrap:anywhere}
.prompt .sent{font-weight:800;font-size:21px;border:2px solid var(--line);border-radius:16px;padding:10px 14px;background:var(--surface);position:relative}
.translit{color:var(--muted);font-weight:700;font-size:16px;display:block;margin-top:2px}
.speak{border:0;background:var(--lang);color:#fff;width:56px;height:52px;border-radius:14px;box-shadow:0 4px 0 var(--lang-dark);display:grid;place-items:center;flex:none}
.speak:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lang-dark)}
.speak svg{width:28px;height:28px}
.speak.slow{width:46px;height:44px;background:var(--surface);color:var(--lang);border:2px solid var(--line-2);box-shadow:0 3px 0 var(--line-2);font-family:var(--display);font-size:12px}
.speak.huge{width:120px;height:110px;border-radius:24px;box-shadow:0 7px 0 var(--lang-dark)}
.speak.huge svg{width:56px;height:56px}
.listen-row{display:flex;justify-content:center;align-items:flex-end;gap:14px;padding:6px 0}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:12px;border:2px solid var(--line-2);border-bottom-width:5px;background:var(--surface);border-radius:16px;padding:14px 16px;text-align:left;font-weight:800;font-size:18px;min-height:60px}
.opt:hover{background:var(--surface-2)}
.opt .k{width:28px;height:28px;border:2px solid var(--line-2);border-radius:8px;display:grid;place-items:center;font-size:13px;color:var(--muted);flex:none}
.opt[aria-pressed="true"]{border-color:var(--lang);background:color-mix(in srgb,var(--lang) 12%,var(--surface));color:var(--lang)}
.opt[aria-pressed="true"] .k{border-color:var(--lang);color:var(--lang)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-ink)}
.opt small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.intro{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:26px;display:grid;gap:14px;justify-items:center;text-align:center}
.intro .word{font-family:var(--display);font-weight:600;font-size:clamp(36px,9vw,56px);line-height:1.05;overflow-wrap:anywhere}
.intro .mean{font-size:22px;font-weight:800}
.intro .also{color:var(--muted);font-weight:700;font-size:14px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pairs .col{display:grid;gap:12px;align-content:start}
.ptile{border:2px solid var(--line-2);border-bottom-width:5px;background:var(--surface);border-radius:14px;padding:12px;font-weight:800;font-size:17px;min-height:58px;overflow-wrap:anywhere}
.ptile[aria-pressed="true"]{border-color:var(--lang);color:var(--lang);background:color-mix(in srgb,var(--lang) 12%,var(--surface))}
.ptile.matched{border-color:var(--line);color:var(--locked-ink);background:var(--surface-2);border-bottom-width:2px;opacity:.6;cursor:default}
.ptile.miss{border-color:var(--bad);color:var(--bad-ink);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.answer-line{min-height:118px;border-bottom:2px solid var(--line-2);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:8px 0;
  background:repeating-linear-gradient(to bottom,transparent 0 56px,var(--line) 56px 58px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.wt{border:2px solid var(--line-2);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:800;font-size:17px;line-height:1.2}
.wt:hover{background:var(--surface-2)}
.wt.used{background:var(--surface-2);color:transparent;border-color:var(--surface-2);cursor:default}
.type-in{width:100%;min-height:120px;border:2px solid var(--line-2);border-radius:16px;background:var(--surface);padding:14px 16px;font-size:20px;font-weight:700;resize:none}
.type-in:focus{border-color:var(--lang);outline:0}
.hint-btn{align-self:flex-start}
.l-foot{border-top:2px solid var(--line);background:var(--bg);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.l-foot.ok{background:var(--ok-soft);border-color:transparent}
.l-foot.bad{background:var(--bad-soft);border-color:transparent}
.l-foot-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.fb{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
.fb .mark{width:56px;height:56px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.fb .mark svg{width:32px;height:32px}
.l-foot.ok .fb{color:var(--ok-ink)} .l-foot.bad .fb{color:var(--bad-ink)}
.l-foot.ok .mark{color:var(--ok)} .l-foot.bad .mark{color:var(--bad)}
.fb h3{font-size:24px}
.fb p{margin:2px 0 0;font-weight:800;overflow-wrap:anywhere}
.fb .gain{font-family:var(--display);font-weight:600;color:var(--xp);margin-left:6px}
.l-foot .btn{min-width:170px}
.skip{border:2px solid var(--line-2);background:none;color:var(--muted);border-radius:14px;padding:11px 18px;font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.l-foot.soft{background:var(--surface-2);border-color:transparent}
.l-foot.soft .mark{color:var(--xp)}

/* pronunciation */
.mic-wrap{display:grid;justify-items:center;gap:10px;padding:6px 0;text-align:center}
.mic{--c:var(--lang);--cd:var(--lang-dark);border:0;width:112px;height:104px;border-radius:32px;background:var(--c);color:#fff;box-shadow:0 7px 0 var(--cd);display:grid;place-items:center;position:relative;transition:transform .06s,box-shadow .06s}
.mic svg{width:52px;height:52px}
.mic:active{transform:translateY(5px);box-shadow:0 2px 0 var(--cd)}
.mic.on{--c:var(--heart);--cd:#b8293f}
.mic.on::after{content:"";position:absolute;inset:-10px;border-radius:40px;border:4px solid color-mix(in srgb,var(--heart) 45%,transparent);animation:pulse 1.2s ease-out infinite}
.mic.small{width:56px;height:52px;border-radius:16px;box-shadow:0 4px 0 var(--cd)}
.mic.small svg{width:28px;height:28px}
.mic.small.on::after{border-radius:22px;inset:-7px}
.mic-label{font-weight:800;color:var(--muted)}
.score{display:flex;align-items:center;gap:12px;width:min(320px,100%)}
.score b{font-family:var(--display);font-size:30px;min-width:76px;text-align:right}
.score .bar{flex:1}
.score.g b{color:var(--ok)} .score.g .bar i{background:var(--ok)}
.score.m b{color:var(--xp)} .score.m .bar i{background:var(--xp)}
.score.b b{color:var(--bad)} .score.b .bar i{background:var(--bad)}
.said{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:19px;font-weight:800}
.said span{border-radius:9px;padding:2px 8px}
.said .g{background:var(--ok-soft);color:var(--ok-ink)}
.said .m{background:color-mix(in srgb,var(--xp) 18%,var(--surface));color:color-mix(in srgb,var(--xp) 60%,var(--ink))}
.said .b{background:var(--bad-soft);color:var(--bad-ink)}
.heard{margin:0;color:var(--muted);font-weight:700;font-size:14px}
.mic-err{background:var(--bad-soft);color:var(--bad-ink);border-radius:14px;padding:12px 14px;font-weight:700}
.tipbox{background:color-mix(in srgb,var(--lang) 9%,var(--surface));border:2px solid color-mix(in srgb,var(--lang) 28%,transparent);border-radius:16px;padding:12px 14px;font-weight:700}
.tipbox b{color:var(--lang)}
.tip-text{margin:0;font-weight:700;font-size:17px;max-width:46ch}
.ex-row{display:flex;flex-wrap:wrap;gap:8px}
.ex{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line-2);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:6px 10px;font-weight:800;text-align:left;line-height:1.15}
.ex:hover{background:var(--surface-2)}
.ex svg{width:18px;height:18px;color:var(--lang)}
.ex small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.pair{display:inline-flex;align-items:center;gap:6px}
.vs{color:var(--muted);font-weight:800}
.snd{padding:14px 0;border-top:2px solid var(--line);display:grid;gap:10px}
.snd:first-of-type{border-top:0}
.snd-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.snd h4{font-family:var(--display);font-weight:600;font-size:19px;margin:0}
.snd p{margin:0;font-weight:700}
.snd .lbl{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.mnum{width:30px;height:30px;border-radius:10px;background:var(--lang);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:600}

/* end screen */
.end{max-width:560px;margin:0 auto;padding:32px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));text-align:center;display:grid;gap:18px}
.end h1{font-size:clamp(30px,6vw,40px);color:var(--gold-dark)}
.end .sub{margin:-8px 0 0;color:var(--muted);font-weight:700}
.end-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.es{border:2px solid var(--c);border-radius:16px;overflow:hidden;background:var(--surface)}
.es span{display:block;background:var(--c);color:#fff;font-family:var(--display);font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:.06em;padding:5px}
.es b{display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--display);font-size:24px;padding:12px 6px;color:var(--c);font-variant-numeric:tabular-nums}
.es b svg{width:22px;height:22px}
.rewards{display:grid;gap:10px;text-align:left}
.rw{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:800;animation:slidein .4s both}
.rw svg{width:28px;height:28px;flex:none}
.rw small{display:block;color:var(--muted);font-weight:700}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}}
.rewards .rw:nth-child(1){animation-delay:.2s}.rewards .rw:nth-child(2){animation-delay:.32s}.rewards .rw:nth-child(3){animation-delay:.44s}.rewards .rw:nth-child(4){animation-delay:.56s}.rewards .rw:nth-child(n+5){animation-delay:.68s}
.lvlup{background:var(--xp);color:#fff;border-color:transparent}
.lvlup small{color:rgba(255,255,255,.9)}
.tower-big{width:120px;height:120px;margin:0 auto}

/* modal + toasts */
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,14,20,.55);display:grid;place-items:center;padding:16px}
.modal-box{background:var(--surface);border-radius:22px;max-width:520px;width:100%;max-height:min(86vh,720px);overflow:auto;padding:22px;box-shadow:var(--shadow);border:2px solid var(--line)}
.modal-box h2{font-size:24px;margin-bottom:6px}
.modal-box .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.modal-box .acts .btn{flex:1}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;display:grid;gap:8px;width:min(420px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-weight:800;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);animation:slidein .3s both}
.toast svg{width:24px;height:24px;flex:none}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90;width:100%;height:100%}

/* conversations */
.talk-row{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:2px solid var(--line);background:none;padding:12px 4px;text-align:left;border-radius:0}
.talk-row:hover{background:var(--surface-2)}
.talk-row b{display:block;font-size:17px}.talk-row small{display:block;color:var(--muted);font-weight:700}
.talk-row .grow{flex:1;min-width:0}
.talk-ic{width:42px;height:42px;border-radius:12px;background:var(--lang);color:#fff;display:grid;place-items:center;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.mini-stars{display:flex;gap:2px;color:var(--line-2)}.mini-stars i{display:grid}.mini-stars svg{width:18px;height:18px}.mini-stars .on{color:var(--gold)}
.lvl-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}.lvl-head h3{margin:0}
.lvl-badge{background:var(--lang);color:#fff;font-family:var(--display);font-weight:600;border-radius:8px;padding:3px 8px;font-size:14px}
.lvl-block.locked .lvl-badge{background:var(--line-2)}
.soon{margin:6px 0 0;font-weight:700}
.l-in.talk{gap:14px}
.scene h2{margin:4px 0 0;font-family:var(--display);font-weight:600}.scene p{margin:2px 0 0;font-weight:700}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:85%;border-radius:18px;padding:10px 14px;font-weight:700;animation:slidein .3s both}
.bub p{margin:0;font-size:19px;line-height:1.3}
.bub .who{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.bub.npc{align-self:flex-start;background:var(--surface);border:2px solid var(--line);border-bottom-left-radius:6px}
.bub.me{align-self:flex-end;background:var(--lang);color:#fff;border-bottom-right-radius:6px;display:grid;gap:6px;justify-items:end}
.bub.me small{font-weight:700;opacity:.9;font-size:13px}
.bub.me .chip{padding:2px 8px;font-size:13px;display:inline-flex;gap:4px;align-items:center;color:var(--ink)}
.bub.me .chip svg{width:14px;height:14px}
.bub-acts{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.bub-acts .say{width:34px;height:34px}
.your-turn{display:grid;gap:10px}
.your-turn p{margin:0;font-weight:700}
.miss{color:var(--bad-ink);background:var(--bad-soft);border-radius:12px;padding:10px 12px}
.hint{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.talk-opts{display:grid;gap:8px}.talk-opts .opt{font-size:16px;min-height:52px;padding:10px 14px}
.opt.wrong{border-color:var(--bad);color:var(--bad-ink);background:var(--bad-soft);animation:shake .35s}
.talk-foot{justify-content:center;flex-wrap:nowrap}
.talk-foot .mic{width:84px;height:78px;border-radius:26px}
.talk-help{display:flex;flex-direction:column;gap:4px;position:absolute;left:max(16px,env(safe-area-inset-left,0px))}
.talk-foot{position:relative;min-height:84px}
.talk-foot .mic-label{position:absolute;right:max(16px,env(safe-area-inset-right,0px))}
.stars{display:flex;justify-content:center;gap:10px;color:var(--line-2)}
.stars svg{width:54px;height:54px}.stars .on{color:var(--gold);animation:pop .4s both}
.stars .on:nth-child(2){animation-delay:.15s}.stars .on:nth-child(3){animation-delay:.3s}
.who-s{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:800}
.rec-box{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:2px dashed var(--line-2);border-radius:16px;padding:12px}
.rec-box p{flex-basis:100%;margin:0;font-size:14px}
@media (max-width:760px){ .nav button[data-v="shop"]{display:none} .talk-foot .mic-label{display:none} }

/* story mode */
.vn{gap:14px}
.stage{position:relative;aspect-ratio:240/105;max-height:300px;width:100%;border-radius:20px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);background:#3a2a1f}
.stage .lay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;pointer-events:none}
.lay.back{filter:blur(.7px) saturate(1.08) brightness(.96)}
.lay.mid{filter:saturate(1.08)}
.lay.front{filter:blur(2.4px) brightness(.8);z-index:2}
.fx-light{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--c) 0,transparent 66%);mix-blend-mode:screen;opacity:.5;pointer-events:none;z-index:2;animation:flick 3.2s ease-in-out infinite alternate}
@keyframes flick{to{opacity:.38;transform:translate(-50%,-50%) scale(1.06)}}
.fx-rays{position:absolute;width:150%;height:70%;transform-origin:0 0;transform:rotate(var(--a));pointer-events:none;z-index:2;mix-blend-mode:screen;
  background:repeating-linear-gradient(to bottom,rgba(var(--rc),0) 0 7%,rgba(var(--rc),.2) 9% 13%,rgba(var(--rc),0) 16% 22%,rgba(var(--rc),.12) 24% 27%,rgba(var(--rc),0) 30% 36%);
  -webkit-mask-image:linear-gradient(to right,#000,transparent 75%);mask-image:linear-gradient(to right,#000,transparent 75%);animation:sway 9s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(calc(var(--a) + 3deg));opacity:.75}}
.fx-vig{position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(12,8,6,.55) 100%),linear-gradient(180deg,rgba(255,200,140,.08),transparent 40%)}
.fx-dust{position:absolute;inset:0;pointer-events:none;z-index:3}
.fx-dust b{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff3d0;opacity:0;animation:dust 7s linear infinite;box-shadow:0 0 3px #fff3d0}
@keyframes dust{0%{opacity:0;transform:translate(0,0)}25%{opacity:.85}100%{opacity:0;transform:translate(16px,-34px)}}
.stage-label,.bracelet{z-index:4}
.say-res{display:grid;gap:6px;justify-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px}
.say-back{display:grid;gap:8px;justify-items:center;text-align:center;background:var(--surface-2);border-radius:16px;padding:12px;font-weight:800}
.say-back b{display:flex;align-items:center;gap:6px;color:var(--lang)}
.say-back b svg{width:20px;height:20px}
img.pix{image-rendering:pixelated;display:block}
.actor{position:absolute!important;z-index:1;bottom:0;left:0;right:0;margin:0 auto;width:max-content;height:80%}
.actor img.pix{height:100%;width:auto;filter:drop-shadow(0 0 1px rgba(255,226,170,.7)) drop-shadow(0 4px 2px rgba(0,0,0,.45))}
.vn-name{display:flex;align-items:center;gap:6px}
img.pix.mini{width:22px;height:auto;border-radius:6px;background:rgba(0,0,0,.08)}

  fr: [["vert", "verre", "vers", "ver"], ["cent", "sans", "sang"], ["vin", "vingt", "vain"], ["eau", "au", "oh", "haut"], ["mere", "mer", "maire"], ["pain", "pin", "peint"], ["sept", "cette", "set"], ["sel", "selle", "celle"], ["et", "est"], ["deux", "de"]],
  es: [["hola", "ola"]],
};
const homoMap = {};
for (const [lang, groups] of Object.entries(HOMO)) { homoMap[lang] = {}; for (const g of groups) for (const w of g) homoMap[lang][w] = g[0]; }
function spWords(s, lang) {
  const nums = (NUMS[lang] || "").split(" "), hm = homoMap[lang] || {};
  return loose(s).replace(/['’]/g, "").replace(/-/g, " ").split(" ").filter(Boolean)
    .map(w => /^\d+$/.test(w) && nums[+w] ? loose(nums[+w]) : w).map(w => hm[w] || w);
}
function dist(a, b) {
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
const sim = (a, b) => a === b ? 1 : !a || !b ? 0 : 1 - dist(a, b) / Math.max(a.length, b.length);
// Score 0-100: how close what the recognizer heard is to the target, word by word and as a whole.
function scoreSpeech(text, heard, lang) {
  let best = null;
  for (const target of text.split("|")) {
    const tw = spWords(target, lang);
    if (!tw.length) continue;
    for (const h of heard) {
      const hw = spWords(h, lang);
      let j = 0;
      const marks = tw.map(w => {
        if (w === "*") { if (j < hw.length) { j++; return 1; } return 0; }  // wildcard: any one word (a name)
        let bi = -1, bs = 0;
        for (let k = j; k < hw.length; k++) { const s = sim(w, hw[k]); if (s > bs) { bs = s; bi = k; } if (s === 1) break; }
        if (bs >= .75) j = bi + 1;
        return bs;
      });
      // a word that clearly wasn't recognized counts half, so one wrong word shows in the score
      const words = marks.reduce((a, m) => a + (m >= .75 ? m : m / 2), 0) / tw.length;
      const whole = tw.includes("*") ? words : sim(tw.join(" "), hw.join(" "));
      const score = Math.round(100 * (.7 * words + .3 * whole));
      if (!best || score > best.score) best = { score, heard: h, target, marks };
    }
  }
  return best || { score: 0, heard: heard[0] || "", target: first(text), marks: [] };
}
const speechKey = (lang, text) => lang + ":" + first(text);
const speechScore = (lang, text) => S.speech[speechKey(lang, text)];
function speechAvg(lang) {
  const v = Object.entries(S.speech).filter(([k]) => k.startsWith(lang + ":")).map(e => e[1]);
  return { n: v.length, avg: v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : 0 };
}
function countSpoken(score) {
  S.stats.spoken++; const d = today(); d.spoken = (d.spoken || 0) + 1;
  if (score >= 90) S.stats.spokenGreat++;
}
function micErrorText(err) {
  if (err === "not-allowed" || err === "service-not-allowed") return "O microfone está bloqueado para este site. Libere nas configurações do navegador (no ícone ao lado do endereço) e recarregue a página. Até lá, use a autoavaliação.";
  if (err === "audio-capture") return "Não encontrei nenhum microfone neste aparelho. Até lá, use a autoavaliação.";
  return "O reconhecimento de voz não funcionou neste navegador. Tente no Chrome ou no Edge. Até lá, use a autoavaliação.";
}

function confetti(n = 140) {
  if (reduceMotion) return;
  const c = $("#confetti"), x = c.getContext("2d");
  const W = c.width = innerWidth * devicePixelRatio, H = c.height = innerHeight * devicePixelRatio;
  const cols = [getComputedStyle(document.documentElement).getPropertyValue("--lang").trim() || "#3d6ee8", "#f5b800", "#3aa935", "#ef3f5a", "#0ea5bd", "#ff7a1a"];
  const ps = Array.from({ length: n }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 18 * devicePixelRatio, vy: (-Math.random() * 16 - 6) * devicePixelRatio, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, w: (6 + Math.random() * 6) * devicePixelRatio, h: (8 + Math.random() * 8) * devicePixelRatio, c: pick(cols) }));
  const t0 = performance.now();
  (function f(now) {
    x.clearRect(0, 0, W, H);
    const alive = now - t0 < 2800;
    for (const p of ps) {
      p.vy += .45 * devicePixelRatio; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); x.restore();
    }
    if (alive) requestAnimationFrame(f); else x.clearRect(0, 0, W, H);
  })(t0);
}

const TALKS = window.XIB_TALKS || {};

const TALK_OK = 70;

let TK = null;
function startTalk(id) {
  const lang = S.lang, talk = talksOf(lang).find(t => t.id === id); if (!talk) return;

}
const tkStep = () => TK.talk.steps[TK.i];

function talkAnswer(heard) {

let recStream = null;
async function recordAndCompare() {

// ---------- story mode ----------
// A visual novel: scenes, characters, choices that branch, a backpack of items. Every answer can be
// spoken; a clear answer makes the bracelet glow. Mistakes have consequences inside the story.
const STORY = window.XIB_STORY || {};
const storyOf = lang => STORY[lang];
const STORY_SPEAK = 60;
const NUMW = "zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty".split(" ");
let SY = null;
function startStory(id) {
  const st = storyOf("en"), ch = st && st.chapters.find(c => c.id === id); if (!ch) return;
  closeModal();
  SY = { st, ch, i: 0, purse: ch.purse, flags: new Set(), mistakes: 0, shards: 0, xp: 0, who: null, scene: "room", label: "", t0: Date.now(),
    pick: null, wrongs: new Set(), seen: new Set(), found: false, miss: null, hand: 0, payFb: null, listening: false, err: "", heard: "", trOn: false, scores: [], drill: null, drilled: false };
  document.body.classList.add("locked"); $("#lesson").hidden = false;
  if (HD) HD.prefetch([...new Set(["room", ...ch.nodes.filter(n => n.scene).map(n => n.scene)])]);
  syAdvance(0);
}
const syNode = () => SY.ch.nodes[SY.i];
const syJump = id => SY.ch.nodes.findIndex(n => n.id === id);
function bagAdd(item) {
  const it = SY.st.items[item]; if (!it) return;
  S.bag ||= []; if (!S.bag.includes(item)) S.bag.push(item);
  toast(`${it.ic} Na mochila: <b>${esc(it.w)}</b> · ${esc(it.pt)}`, "bag"); save();
}
function syCoins(n) { SY.purse = Math.max(0, SY.purse + n); if (n < 0 && S.sound) tone(220, 0, .2, "triangle", .08); }
// play every instant node (scene, item, coins, jump) until one needs the learner
function syAdvance(to) {
  SY.i = to;
  for (let guard = 0; guard < 500; guard++) {
    const n = syNode();
    if (!n) { if (!SY.drilled) startDrill(); else finishStory(); return; }
    if ((n.when && !SY.flags.has(n.when)) || (n.unless && SY.flags.has(n.unless))) { SY.i++; continue; }
    if (n.scene) { SY.scene = n.scene; SY.label = n.label || ""; }
    if (n.give) bagAdd(n.give);
    if (n.coins) syCoins(n.coins);
    if (n.go && !n.choice) { SY.i = syJump(n.go); continue; }
    if (n.nar || n.say || n.choice || n.explore || n.find || n.pay || n.memory || n.lesson) break;
    SY.i++;
  }
  Object.assign(SY, { pick: null, wrongs: new Set(), seen: new Set(), found: false, miss: null, hand: 0, payFb: null, listening: false, err: "", heard: "", trOn: false });
  const n = syNode();
  if (n.say) SY.who = n.say;
  renderStory();
  const line = n.say ? n.t : n.find ? n.line : n.memory ? n.memory[0] : null;
  if (line) setTimeout(() => SY && syNode() === n && speak(line, "en"), 300);
  if (n.pay) setTimeout(() => SY && syNode() === n && speak(`That's ${NUMW[n.pay]} coins.`, "en"), 300);
}
function syNext() {
  const n = syNode();
  if (n.choice && SY.pick) {
    const o = SY.pick;
    if (o.retry && !o.ok) { SY.pick = null; SY.heard = ""; renderStory(); return; }
    if (o.cost) syCoins(-o.cost);
    if (o.give) bagAdd(o.give);
    if (o.flag) SY.flags.add(o.flag);
    if (o.go) { syAdvance(syJump(o.go)); return; }
  }

}
function syGlow() { SY.shards++; SY.glow = true; setTimeout(() => { if (SY) SY.glow = false; }, 1200); }

function syScore(score) { SY.scores.push(score); countSpoken(score); if (score >= GREAT) syGlow(); }
function syChoose(o, score, res) {
  const n = syNode(); if (!n.choice || SY.pick) return;
  SY.pick = o; SY.pickScore = score ?? null; SY.pickRes = res || null; SY.back = null;
  if (o.ok) {
    SY.xp += score != null ? 15 : 10; sfx("ok");
    if (score != null) syScore(score);

const PB = "\f", MARK = "⁣"; // page break; invisible caret marker used while re-paginating

const nLang = () => noteLang || S.lang;

// does this text fit on one page?
function noteFits(text) {
  const m = $("#noteMeasure"); m.value = text;
  return m.scrollHeight <= m.clientHeight + 1;
}
// Split the notebook into pages: [{ s, e, n }] where s..e is the text shown and n is where the next page starts.
function paginate(full) {
  $("#noteMeasure").style.width = $("#noteText").offsetWidth + "px";
  const pages = []; let s = 0;
  for (;;) {
    const brk = full.indexOf(PB, s), end = brk < 0 ? full.length : brk, chunk = full.slice(s, end);
    if (noteFits(chunk)) {
      pages.push({ s, e: end, n: end + 1 });
      if (brk < 0) break; s = end + 1; continue;
    }
    let lo = 0, hi = chunk.length;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (noteFits(chunk.slice(0, mid))) lo = mid; else hi = mid - 1; }
    // break at a line end if there's one near, else at a space, else mid-word
    const nl = chunk.lastIndexOf("\n", lo - 1), sp = chunk.lastIndexOf(" ", lo - 1);
    const cut = nl > lo * .5 ? nl : sp > lo * .6 ? sp : -1;
    if (cut >= 0) pages.push({ s, e: s + cut, n: s + cut + 1 });
    else { const c = Math.max(1, lo); pages.push({ s, e: s + c, n: s + c }); }
    s = pages[pages.length - 1].n;
  }
  return pages;
}
const noteFull = lang => typeof NOTES[lang] === "string" ? NOTES[lang] : (NOTES[lang] = "");

  const ta = $("#noteText"), pg = notePages[i];
  ta.value = full.slice(pg.s, pg.e);

  noteChrome();
}
function noteChrome() {
  const lang = nLang(), i = notePage[lang], n = notePages.length, full = noteFull(lang);
  const filled = notePages.filter(p => full.slice(p.s, p.e).trim()).length;
  $("#noteCount").textContent = `${filled} ${filled === 1 ? "folha escrita" : "folhas escritas"}`;
  $("#noteNum").textContent = `Folha ${i + 1}`; $("#noteFoot").textContent = `${i + 1} / ${n}`; $("#notePos").textContent = `Folha ${i + 1} de ${n}`;
  $("#notePrev").disabled = !i;
  $("#noteNextBtn").hidden = i + 1 >= n; $("#noteNewBtn").hidden = i + 1 < n;
  $("#noteDelBtn").disabled = !full; $("#noteWipeBtn").disabled = !full.trim();
}
function noteInput() {
  const lang = nLang(), ta = $("#noteText"), i = notePage[lang], pg = notePages[i], full = noteFull(lang);
  const caret = ta.selectionStart, typed = ta.value.split(PB).join("");
  // splice this page back into the whole text with a marker at the caret, re-paginate, then find the marker
  const marked = full.slice(0, pg.s) + typed.slice(0, caret) + MARK + typed.slice(caret) + full.slice(pg.e);
  const pages = paginate(marked), at = marked.indexOf(MARK);
  let j = pages.findIndex(p => at >= p.s && at <= p.e); if (j < 0) j = pages.findIndex(p => at < p.n); if (j < 0) j = pages.length - 1;
  const clean = marked.replace(MARK, "");

  notePages = pages.map(p => ({ s: p.s - (p.s > at ? 1 : 0), e: p.e - (p.e > at ? 1 : 0), n: p.n - (p.n > at ? 1 : 0) }));
  const np = notePages[j], shown = clean.slice(np.s, np.e), pos = Math.min(Math.max(0, at - np.s), shown.length);
  const turned = j !== i;

document.addEventListener("input", e => { if (e.target.id === "noteText") noteInput(); });

let noteResize = 0;
window.addEventListener("resize", () => { clearTimeout(noteResize); noteResize = setTimeout(() => { if (S.view === "notes" && !LS && !TK) noteMount(); }, 200); });

const noteAllText = lang => {

  return pages.map((p, i) => { const t = full.slice(p.s, p.e).replace(/\f/g, "\n\n").trim(); return t ? (pages.length > 1 ? `— Folha ${i + 1} —\n` : "") + t : ""; }).filter(Boolean).join("\n\n");

  noteNew: () => {
    const l = nLang(), full = noteFull(l), last = notePages[notePages.length - 1];
    if (!full.slice(last.s, last.e).trim()) { toast("Escreva algo nesta folha antes de abrir outra.", "pen"); $("#noteText").focus(); return; }
    NOTES[l] = full + PB; notePage[l] = Infinity; noteTurn(notePages.length, true);
  },
  noteCopy: () => copyText(notePageText(), "Folha copiada"),
  noteCopyAll: () => copyText(noteAllText(nLang()), "Caderno copiado"),
  noteShare: async () => {
    const text = notePageText(); if (!text) { toast("Esta folha está vazia.", "pen"); return; }
    if (navigator.share) { try { await navigator.share({ text }); } catch {} return; }
    copyText(text, "Folha copiada");
  },
  noteZap: () => {
    const text = notePageText(); if (!text) { toast("Esta folha está vazia.", "pen"); return; }
    window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank", "noopener");
  },
  noteFile: () => {
    const l = nLang(), text = noteAllText(l); if (!text) { toast("O caderno está vazio.", "pen"); return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([`Caderno de ${LANGS[l].learning} · Xibolete\n\n${text}\n`], { type: "text/plain;charset=utf-8" }));
    a.download = `caderno-${LANGS[l].learning.normalize("NFD").replace(/[̀-ͯ]/g, "")}.txt`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  noteDel: () => modal(`<h2>Apagar a folha ${notePage[nLang()] + 1}?</h2><p class="muted" style="font-weight:700">O que está escrito nesta folha some de vez. O resto do caderno continua.</p>
    <div class="acts"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn bad" data-act="noteDelYes">Apagar folha</button></div>`),
  noteDelYes: () => {
    const l = nLang(), full = noteFull(l), i = notePage[l], p = notePages[i];
    // drop the page and the break or space that joined it to its neighbours
    NOTES[l] = full.slice(0, p.s) + full.slice(Math.min(full.length, p.n));
    if (NOTES[l].endsWith(PB) && i >= notePages.length - 1) NOTES[l] = NOTES[l].slice(0, -1);
    closeModal(); noteTurn(Math.max(0, i - (i >= notePages.length - 1 ? 1 : 0))); toast("Folha apagada.", "trash");
  },
  noteWipe: () => modal(`<h2>Apagar o caderno de ${esc(LANGS[nLang()].learning)}?</h2><p class="muted" style="font-weight:700">Todas as folhas deste idioma somem de vez. Os cadernos dos outros idiomas continuam. Se quiser guardar uma cópia, baixe o arquivo .txt antes.</p>
    <div class="acts"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn bad" data-act="noteWipeYes">Apagar caderno</button></div>`),
  noteWipeYes: () => { NOTES[nLang()] = ""; closeModal(); noteTurn(0); toast("Caderno apagado.", "trash"); },
  // conversations
  talkStart: d => startTalk(d.id),
  talkPt: d => { const e = TK.log.find(x => x.who === "npc" && x.step === +d.s); if (e) e.pt = !e.pt; renderTalk(); },
  talkMic: () => {
    if (!TK || TK.fb || !canListen()) return;
    if (TK.listening) { if (rec) try { rec.stop(); } catch {} return; }
    TK.listening = true; TK.err = ""; renderTalk();
    listen(TK.lang, res => {
      if (!TK || TK.mode !== "talk") return;
      TK.listening = false;
      if (res.error) {
        if (res.error === "no-speech" || res.error === "aborted") TK.err = "Não ouvi nada. Toque no microfone e fale perto do aparelho.";
        else { micBroken = true; micMsg = micErrorText(res.error); TK.err = micMsg; TK.opts ||= talkOptions(); }
        renderTalk(); return;
      }
      talkAnswer(res);
    });
  },
  talkHint: () => { TK.hint = true; renderTalk(); },
  talkOpts: () => { TK.opts = talkOptions(); renderTalk(); },
  talkOpt: d => {
    if (!TK || TK.fb) return;
    const i = +d.i, o = TK.opts[i]; speak(o, TK.lang);
    if (canListen()) { TK.chosen = i; renderTalk(); return; }
    // without a recognizer: picking the right reply moves on, it is spoken aloud to repeat
    if (o !== tkStep().say) { TK.wrong = i; if (S.sound) tone(330, 0, .18, "triangle", .08); renderTalk(); return; }
    TK.log.push({ who: "me", text: o });
    TK.xp += 10; TK.fb = { ok: true, title: "Isso! Agora repita em voz alta", gain: 10, note: tkStep().sayPt };
    sfx("ok"); renderTalk();
  },
  talkNext: () => talkNext(),
  talkQuit: () => modal(`<h2>Sair da conversa?</h2><p class="muted" style="font-weight:700">O que você falou até aqui não será salvo.</p>
    <div class="acts"><button class="btn" data-act="closeModal">Continuar conversando</button><button class="btn bad" data-act="talkQuitYes">Sair</button></div>`),
  talkQuitYes: () => { closeModal(); closeTalk(); },
  talkClose: () => closeTalk(),
  shadowGo: () => startShadow(),
  shadowMic: () => {
    if (!TK || !canListen()) return;
    if (TK.listening) { if (rec) try { rec.stop(); } catch {} return; }
    TK.listening = true; TK.err = ""; renderShadow();
    const ln = TK.lines[TK.si];
    listen(TK.lang, res => {
      if (!TK || TK.mode !== "shadow") return;
      TK.listening = false;
      if (res.error) TK.err = res.error === "no-speech" || res.error === "aborted" ? "Não ouvi nada. Toque no microfone e repita." : micErrorText(res.error);
      else { TK.sres = scoreSpeech(ln.t, res, TK.lang); countSpoken(TK.sres.score); save(); }
      renderShadow();
    });
  },
  shadowNext: () => { stopListening(); if (TK.si + 1 >= TK.lines.length) { closeTalk(); toast("Falas repetidas. Boa!", "mic"); return; } TK.si++; TK.sres = null; TK.err = ""; TK.listening = false; renderShadow(); setTimeout(() => speak(TK.lines[TK.si].t, TK.lang), 250); },
  shadowPrev: () => { stopListening(); TK.si = Math.max(0, TK.si - 1); TK.sres = null; TK.err = ""; TK.listening = false; renderShadow(); setTimeout(() => speak(TK.lines[TK.si].t, TK.lang), 250); },
  recGo: () => recordAndCompare(),
  recPlay: () => playClip(),
  // lesson
  opt: d => {
    if (LS.state !== "answer") return; LS.sel = +d.i; sfx("tap"); const it = curItem();
    if (S.sound && it.k === "chooseRev") speak(it.opts[LS.sel][0], LS.lang);
    if (S.sound && it.k === "minimal") speak(it.opts[LS.sel], LS.lang);
    renderLesson();
  },
  check: () => check(false),
  skipQ: () => check(true),
  next: () => next(),
  pairL: d => pairTap("L", +d.i),
  pairR: d => pairTap("R", +d.i),
  pick: d => { const it = curItem(); if (LS.state !== "answer") return; it.picked.push(+d.i); sfx("tap"); renderLesson(); },
  unpick: d => { const it = curItem(); if (LS.state !== "answer") return; it.picked = it.picked.filter(i => i !== +d.i); renderLesson(); },
  hint: () => { curItem().hint = !curItem().hint; renderLesson(); },
  quit: () => quitAsk(),
  quitYes: () => { closeModal(); closeLesson(); },
  endDone: () => closeLesson(),
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) {
    if (!$("#langMenu").hidden && !e.target.closest(".lang-wrap")) $("#langMenu").hidden = true;
    if (pop && !e.target.closest(".pop")) { pop = null; render(); }
    return;
  }
  if (el.disabled) return;
  if (el.dataset.act !== "langMenu" && el.dataset.act !== "setLang") $("#langMenu").hidden = true;
  const fn = A[el.dataset.act];
  if (fn) fn(el.dataset);
});
document.addEventListener("keydown", e => {
  if (!$("#modal").hidden) { if (e.key === "Escape") closeModal(); return; }
  if (SY) {
    if (e.key === "Escape") { SY.end ? closeStory() : A.syQuit(); return; }
    if (e.target.closest("button") && e.key === "Enter") return;
    if (SY.drill) { if (e.key === "Enter") { e.preventDefault(); canListen() ? A.syDrillMic() : drillNext(); } return; }
    const n = SY.end ? null : syNode();
    if (e.key === "Enter") {
      e.preventDefault();
      if (SY.end) closeStory();
      else if (n.choice && !SY.pick) A.syMic();
      else if (document.querySelector('[data-act="syNext"]')) syNext();
      return;
    }
    const k = parseInt(e.key, 10);
    if (n && n.choice && !SY.pick && k >= 1 && k <= n.choice.length && !SY.wrongs.has(k - 1)) A.syOpt({ i: k - 1 });
    return;
  }
  if (TK) {
    if (e.key === "Escape") { TK.mode === "talk" ? A.talkQuit() : closeTalk(); return; }
    if (e.key !== "Enter" || e.target.closest("button")) return;
    e.preventDefault();
    if (TK.mode === "end") closeTalk();
    else if (TK.mode === "shadow") A.shadowNext();
    else if (TK.fb) talkNext();
    else A.talkMic();
    return;
  }
  if (!LS) { if (e.key === "Escape") { $("#langMenu").hidden = true; if (pop) { pop = null; render(); } } return; }
  if (LS.finished) { if (e.key === "Enter") { e.preventDefault(); closeLesson(); } return; }
  const it = curItem(), typing = e.target.id === "typeIn";
  if (e.key === "Escape") { quitAsk(); return; }
  if (e.key === "Enter") {
    e.preventDefault();
    if (ungraded(it) || LS.state !== "answer") next();
    else if (it.k === "speak") { if (!selfMode(it)) A.mic(); }
    else check(false);
    return;
  }
  if (typing || LS.state !== "answer") return;
  const n = parseInt(e.key, 10);
  if (it.opts && n >= 1 && n <= it.opts.length) A.opt({ i: n - 1 });
  if (it.k === "build" || it.k === "buildRev") {
    if (e.key === "Backspace" && it.picked.length) { it.picked.pop(); renderLesson(); }
  }
});

// ---------- install as an app ----------
// Android/PC browsers offer an install prompt; on iPhone it's done by hand from Safari's share menu.
let installEvt = null;
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (S.view === "profile" && !LS && !TK && !SY) render(); });
window.addEventListener("appinstalled", () => { installEvt = null; toast("Xibolete instalado! Ele já está na sua tela inicial.", "star"); if (S.view === "profile") render(); });
function installRow() {
  const how = standalone() ? "Você já está usando o app instalado."
    : installEvt ? "Coloque o Xibolete na tela inicial e abra como um app, até sem internet."
    : isIOS() ? "No iPhone, abra este site no Safari, toque em Compartilhar (o quadrado com a seta para cima) e depois em “Adicionar à Tela de Início”."
    : "No Chrome ou no Edge, abra o menu do navegador e escolha “Instalar app” ou “Adicionar à tela inicial”.";
  return `<div class="set-row"><div><b>Instalar o app</b><p>${how}</p></div>${installEvt && !standalone() ? `<button class="btn small" data-act="install">Instalar</button>` : standalone() ? `<span class="chip">${I("check")}Instalado</span>` : ""}</div>`;
}
A.install = async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch {} installEvt = null; render(); };
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
// one gentle hint on phones that haven't installed it yet
if (S.onboarded && !standalone() && !S.installHint && matchMedia("(max-width:760px)").matches) {
  S.installHint = true; save();
  setTimeout(() => toast(`Dica: dá para instalar o Xibolete como app no celular. Veja como em <b>Perfil › Instalar o app</b>.`, "star"), 4000);
}

// ---------- boot ----------
checkStreak();
regen();
if (S.onboarded) { const c = currentOf(S.lang); if (c && S.view === "learn" && !isDone(S.lang, 0, 0)) pop = `${c.u}-${c.l}`; }
render();
if (streakNotice) toast(esc(streakNotice), "flame");
if (S.onboarded && S.view === "learn") {
  const cur = document.querySelector(".node.current");
  cur && cur.scrollIntoView({ block: "center" });
}
setInterval(() => {
  const before = S.hearts; regen();
  if (!LS && (S.hearts !== before || document.visibilityState === "visible")) renderChrome();
}, 60e3);
})();
</script>
</body>
</html>
