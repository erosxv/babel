<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Xibolete</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1d1a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xibolete">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Aprenda inglês, espanhol, francês, italiano e russo jogando e falando em voz alta: pronúncia corrigida por reconhecimento de voz, XP, níveis, sequência e conquistas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
/* Layout: sticky stat bar on top; left nav (bottom bar on phones), a center column holding the
   zig-zag lesson path, and a right rail with today's goal, quests and level on wide screens.
   Lessons open as a full-screen overlay with a feedback footer, like a game round. */
:root{
  /* "Lanterna": the night of the story's tavern is the whole app. Blue-night walls, lamplight gold for the
     main action, cream paper for what people say, pixel letters (like the art) for titles and numbers.
     Each language keeps its own colour (--lang) for its path and banners. */
  --bg:#1d1a2e; --surface:#262140; --surface-2:#312a52; --ink:#f3ead8; --muted:#b9afd3; --line:#3a3360; --line-2:#4b4378;
  --lang:#3d6ee8; --lang-dark:#2a51b5;
  --lamp:#f6c560; --lamp-dark:#b88a2c; --lamp-ink:#2a1e08; --paper:#f3ead8; --paper-edge:#b9a985; --paper-ink:#2a2238; --paper-name:#8a3f2a;
  --ok:#55c250; --ok-dark:#3a9a36; --ok-soft:#1d3326; --ok-ink:#8ee08a;
  --bad:#f0595e; --bad-dark:#b8323a; --bad-soft:#3d1f2c; --bad-ink:#ff9a9d;
  --xp:#f6c560; --coin:#2ec4dc; --heart:#ef3f5a; --flame:#ff8a2a;
  --gold:#f6c560; --gold-dark:#b88a2c; --locked:#2e2a45; --locked-dark:#201d33; --locked-ink:#7a7399;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --display:"Lanterna Digits","Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
/* In the pixel font 5 looks like S and 0 like O, so titles take their digits from the reading font
   (same file the Google Fonts link loads for bold body text) */
html{font-variant-ligatures:no-common-ligatures}  /* the pixel "fi" joins into one odd shape */
@font-face{font-family:"Lanterna Digits";font-weight:400 900;font-display:swap;unicode-range:U+0030-0039;
  src:url(https://fonts.gstatic.com/s/atkinsonhyperlegible/v12/9Bt73C1KxNDXMspQ1lPyU89-1h6ONRlW45G8Wbc9dCWP.woff2) format("woff2")}

*{box-sizing:border-box}
html,body{margin:0;overscroll-behavior:none}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--lang);outline-offset:2px}
svg.i{width:1em;height:1em;flex:none;vertical-align:-.12em}
svg.i.tower,svg.i.tower-big{width:120px;height:120px;display:block;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:0;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 3D game buttons */
.btn{--c:var(--lamp);--cd:var(--lamp-dark);--ci:var(--lamp-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;
  background:var(--c);color:var(--ci);box-shadow:0 4px 0 var(--cd);padding:12px 20px;font-family:var(--display);font-weight:600;font-size:17px;
  letter-spacing:.02em;text-transform:uppercase;transition:transform .06s,box-shadow .06s,filter .15s;white-space:nowrap}
@media (hover: hover) and (pointer: fine){.btn:hover{filter:brightness(1.06)}}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cd)}
.btn[disabled]{--c:var(--locked);--cd:var(--locked-dark);--ci:var(--locked-ink);cursor:default;filter:none}
.btn[disabled]:active{transform:none;box-shadow:0 4px 0 var(--cd)}
.btn.ok{--c:var(--ok);--cd:var(--ok-dark)}
.btn.bad{--c:var(--bad);--cd:var(--bad-dark)}
.btn.gold{--c:var(--gold);--cd:var(--gold-dark);--ci:#3b2a00}
.btn.ghost{--c:var(--surface);--cd:var(--line-2);--ci:var(--ink);border:2px solid var(--line-2);box-shadow:0 3px 0 var(--line-2)}
.btn.small{padding:8px 14px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.linkish{border:0;background:none;color:var(--muted);font-weight:700;padding:6px 8px;border-radius:8px}
@media (hover: hover) and (pointer: fine){.linkish:hover{color:var(--ink);background:var(--surface-2)}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:2px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:31}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.logo{font-family:var(--display);font-weight:700;font-size:26px;color:var(--lang);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo svg{width:28px;height:28px}
.lang-wrap{position:relative}
.lang-btn{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:5px 10px 5px 6px;font-weight:800}
@media (hover: hover) and (pointer: fine){.lang-btn:hover{background:var(--surface-2)}}
.badge{display:inline-grid;place-items:center;width:30px;height:22px;border-radius:6px;background:var(--bc,var(--lang));color:#fff;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.04em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.lang-menu{position:absolute;top:calc(100% + 8px);left:0;background:var(--surface);border:2px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px;min-width:240px;z-index:40}
.lang-menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:10px;padding:9px 10px;text-align:left;font-weight:700}
.lang-menu button[aria-current="true"]{background:var(--surface-2)}
@media (hover: hover) and (pointer: fine){.lang-menu button:hover{background:var(--surface-2)}}
.lang-menu .pct{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.stats{margin-left:auto;display:flex;gap:4px;align-items:center}
.stat{display:flex;align-items:center;gap:5px;border:0;background:none;border-radius:10px;padding:6px 8px;font-family:var(--display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
@media (hover: hover) and (pointer: fine){.stat:hover{background:var(--surface-2)}}
.stat svg{width:22px;height:22px}
.stat.flame{color:var(--flame)} .stat.coin{color:var(--coin)} .stat.heart{color:var(--heart)} .stat.xp{color:var(--xp)}
.stat.flame.off{color:var(--locked-ink)}
.stat.week{color:var(--lang)} .stat.week.off{color:var(--muted)}
.boost-tag{font-size:11px;background:var(--xp);color:#fff;border-radius:6px;padding:1px 5px;margin-left:2px}

/* shell */
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr) 320px;gap:28px;
  padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.nav{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:2px solid transparent;background:none;border-radius:14px;padding:10px 14px;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);text-align:left}
.nav button svg{width:26px;height:26px}
@media (hover: hover) and (pointer: fine){.nav button:hover{background:var(--surface-2);color:var(--ink)}}
.nav button[aria-current="page"]{border-color:color-mix(in srgb,var(--lang) 45%,transparent);background:color-mix(in srgb,var(--lang) 12%,var(--surface));color:var(--lang)}
.nav .dot{width:9px;height:9px;border-radius:50%;background:var(--bad);margin-left:auto}
.view{min-width:0;max-width:640px;width:100%;justify-self:center}
.side{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px}
.card h3{font-size:19px;margin-bottom:10px}
.only-narrow{display:none}
/* Semana da jornada */
.week-card{display:grid;gap:10px;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:0;padding:0;cursor:pointer}
.wk-top{display:flex;align-items:baseline;gap:8px}.wk-top small{margin-left:auto;font-weight:800}
.wk-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk-d{display:grid;justify-items:center;gap:3px}
.wk-d i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-style:normal;font-weight:800;font-size:13px;background:var(--surface-2);color:var(--muted)}
.wk-d.on i{background:var(--lang);color:#fff}.wk-d.on svg{width:16px;height:16px}
.wk-d.today i{box-shadow:inset 0 0 0 2px var(--lang);color:var(--ink)}
.wk-d.next i{opacity:.45}
.wk-d small{font-size:11px;font-weight:800;color:var(--muted)}
.wk-marks{display:flex;gap:6px;flex-wrap:wrap}
.wk-m{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;background:var(--surface-2);font-size:12px;font-weight:800;color:var(--muted)}
.wk-m svg{width:13px;height:13px}.wk-m small{color:var(--coin);font-weight:800}
.wk-m.done{color:var(--ink);background:color-mix(in srgb,var(--lang) 25%,var(--surface-2))}
.cal{display:grid;gap:6px}
.cal-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 36px;gap:6px;align-items:center}
.cal-row > small{text-align:center;font-weight:800;color:var(--muted);font-size:12px}
.cal-d{display:grid;place-items:center;height:32px;border-radius:8px;background:var(--surface-2);font-weight:800;font-size:13px;color:var(--muted)}
.cal-d.on{background:var(--lang);color:#fff}.cal-d.today{box-shadow:inset 0 0 0 2px var(--lang);color:var(--ink)}.cal-d.next{opacity:.35}
.wk-list{display:grid;gap:8px;margin-bottom:12px}
.wk-li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.wk-li > svg{width:20px;height:20px;color:var(--gold);flex:none}.wk-li.done > svg{color:var(--lang)}
.wk-li div{flex:1;min-width:0}.wk-li div b{display:block}.wk-li div small{font-weight:700;color:var(--muted)}
.wk-li > span{display:grid;justify-items:end;font-size:12px;font-weight:800;color:var(--muted)}.wk-li > span b{color:var(--coin);font-size:15px}
/* Domínio */
.skill-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.skill-card{display:grid;gap:8px;align-content:start}
.skill-card.weak{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.sk-head{display:flex;gap:10px;align-items:flex-start}
.sk-head{align-items:center}.sk-head h3{margin:0;font-size:17px}.sk-what{font-weight:700;font-size:13px;margin-top:-4px}
.sk-ic{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--lang) 22%,var(--surface));flex:none}
.sk-ic svg{width:20px;height:20px;color:var(--lang)}
.sk-num{text-align:right;flex:none;display:grid;line-height:1.1}.sk-num b{display:block;font-family:var(--display);font-size:24px;color:var(--gold)}
.sk-num span{font-size:12px;font-weight:800;color:var(--muted)}.sk-num.few b{color:var(--locked-ink)}
.skill-card .bar{height:8px}
.sk-src{margin:0;font-size:13px;font-weight:700;color:var(--muted)}
.sk-facts{margin:0;padding-left:18px;font-size:14px;font-weight:700}
.sk-act{margin-top:2px}
.mastery-tip h3{margin:0 0 4px}.mastery-tip p.muted{margin:0 0 10px;font-weight:700}
.mastery-tip .eyebrow{display:flex;align-items:center;gap:6px;margin:0 0 6px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.mastery-tip .eyebrow svg{width:16px;height:16px}
.home-mastery{display:grid;gap:10px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;width:100%}
.home-mastery:hover{border-color:var(--lang)}
.hm-title{display:flex;align-items:center;gap:8px}.hm-title svg{width:20px;height:20px;color:var(--lang)}.hm-title small{margin-left:auto;font-weight:800}
.hm-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.hm-sk{display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:10px;background:var(--surface-2);min-width:0}
.hm-sk svg{width:18px;height:18px;color:var(--lang)}.hm-sk small{font-size:11px;font-weight:800;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-sk b{font-family:var(--display);font-size:15px}
@media (max-width:760px){ .skill-grid{grid-template-columns:1fr} .hm-row{grid-template-columns:repeat(3,minmax(0,1fr))} }
/* Início */
.home{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.home .eyebrow{display:flex;align-items:center;gap:6px;margin:0 0 6px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.home .eyebrow svg{width:16px;height:16px}
.home-next{background:linear-gradient(135deg,color-mix(in srgb,var(--lang) 30%,var(--surface)),var(--surface-2));border-color:color-mix(in srgb,var(--lang) 45%,var(--line))}
.home-next h2{font-size:24px;margin:0 0 4px}
.home-next>p.muted{margin:0 0 12px;font-weight:700;max-width:60ch}
.home-unit{display:grid;gap:6px;margin-bottom:14px}.home-unit small{color:var(--muted);font-weight:700}
.home-unit .bar{height:10px}
.home-acts{display:flex;flex-wrap:wrap;gap:10px}
.home-next .linkish{margin-top:10px}
.home-tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.home-tool{position:relative;display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line-2);border-bottom-width:4px;border-radius:14px;background:var(--surface);color:var(--ink);padding:12px;font:inherit;cursor:pointer;min-width:0}
.home-tool:hover{border-color:var(--lang)}
.home-tool svg{width:26px;height:26px;flex:none;color:var(--lang)}
.home-tool b{display:block;font-size:16px}.home-tool small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.home-tool span{min-width:0}
.home-tool .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--bad)}
.home-story{padding:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr)}
.home-story .home-stage{border-radius:0;aspect-ratio:240/90;max-height:300px}
.home-story .hs-body{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.home-story h3{margin:0}.home-story p{margin:0;font-weight:700}
.home-story .hs-words{display:flex;align-items:center;gap:6px;font-size:14px}.hs-words svg{width:16px;height:16px;color:var(--gold);flex:none}
.home-story .hs-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:8px}
@media (max-width:760px){
  .home-tools{grid-template-columns:repeat(2,minmax(0,1fr))}
  .home-story .home-stage{aspect-ratio:16/10}
  .home-acts .btn{width:100%;white-space:normal}
}
.pop .hard-btn{margin-top:8px;width:100%;white-space:normal}.pop .hard-btn svg{color:var(--heart)}
.pop .hard-note{margin:6px 0 0;font-size:13px;color:var(--muted);font-weight:700}

/* today strip & goal */
.goal{display:flex;align-items:center;gap:14px}
.ring{width:64px;height:64px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .tr{stroke:var(--surface-2)} .ring .pr{stroke:var(--xp);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:15px;color:var(--xp)}
.goal p{margin:0}
.goal strong{font-family:var(--display);font-weight:600;font-size:18px;display:block}
.bar{height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--xp);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);transition:width .5s}
.bar.lang i{background:var(--lang)}
.quest{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:10px 0;border-top:2px solid var(--line)}
.quest:first-of-type{border-top:0;padding-top:2px}
.quest .qi{grid-row:span 2;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--xp)}
.quest .qi svg{width:22px;height:22px}
.quest.done .qi{background:var(--ok);color:#fff}
.quest span{font-weight:800;font-size:15px}
.quest .row{display:flex;align-items:center;gap:8px}
.quest .row .bar{flex:1;height:12px}
.quest small{color:var(--muted);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.lvl-card{display:flex;align-items:center;gap:14px}
.lvl-num{width:56px;height:56px;border-radius:16px;background:var(--xp);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:26px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15);flex:none}
.lvl-card .meta{flex:1;min-width:0;display:grid;gap:6px}
.lvl-card strong{font-family:var(--display);font-weight:600;font-size:18px}
.lvl-card small{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}

/* learn path */
.unit{margin-bottom:28px}
.unit-banner{background:linear-gradient(180deg,#2c2747,#241f3b);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:inset 6px 0 0 var(--lang),inset 0 1px 0 rgba(255,214,140,.12)}
.unit-banner h2{color:var(--lamp);text-shadow:0 0 14px rgba(246,197,96,.45)}  /* the one glowing thing: the lamp-lit unit title */
.unit-banner.locked{background:var(--locked);color:var(--locked-ink);box-shadow:none}
.unit-banner.locked h2{color:inherit;text-shadow:none}
.unit-banner .eyebrow{margin:0;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.unit-banner h2{font-size:24px;margin:2px 0}
.unit-banner p{margin:0;opacity:.9;font-weight:700}
.guide-btn{border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:inherit;border-radius:12px;padding:8px 12px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;display:flex;gap:6px;align-items:center;white-space:nowrap}
@media (hover: hover) and (pointer: fine){.guide-btn:hover{background:rgba(255,255,255,.22)}}
.unit-banner.locked .guide-btn{border-color:var(--locked-dark)}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding:28px 0 6px}
.node-wrap.has-pop{z-index:10}
.node-wrap{position:relative;z-index:1;transform:translateX(var(--x,0));display:flex;flex-direction:column;align-items:center}
.node{--c:var(--lang);--cd:var(--lang-dark);width:72px;height:66px;border-radius:50%;border:0;background:var(--c);box-shadow:0 7px 0 var(--cd);color:#fff;display:grid;place-items:center;transition:transform .08s,box-shadow .08s;position:relative}
.node svg{width:32px;height:32px}

.node.locked{--c:var(--locked);--cd:var(--locked-dark);color:var(--locked-ink)}
.node.done{--c:var(--gold);--cd:var(--gold-dark);color:#fff}
.node .times{position:absolute;bottom:-4px;right:-6px;background:var(--surface);color:var(--gold-dark);border:2px solid var(--gold);border-radius:99px;font-family:var(--display);font-size:12px;padding:0 6px;line-height:18px}
.node.current::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid color-mix(in srgb,var(--lamp) 45%,transparent);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.18);opacity:0}}
.start-tag{position:absolute;bottom:calc(100% + 14px);background:var(--surface);border:2px solid var(--line);color:var(--lang);font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:14px;padding:6px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.4s ease-in-out infinite;pointer-events:none}
.start-tag::after{content:"";position:absolute;left:50%;top:100%;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-5px) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-4px)}}
.node.chest{--c:var(--surface-2);--cd:var(--line-2);color:var(--locked-ink);border-radius:20px;width:76px}
.node.chest.ready{--c:var(--gold);--cd:var(--gold-dark);color:#fff;animation:wiggle 2.4s ease-in-out infinite}
.node.chest.opened{--c:var(--surface-2);--cd:var(--line-2);color:var(--gold-dark);opacity:.75}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-7deg)}90%{transform:rotate(7deg)}95%{transform:rotate(-4deg)}}
.pop{position:absolute;top:calc(100% + 16px);z-index:5;width:min(260px,calc(100vw - 32px));transform:translateX(calc(-1 * var(--x,0px)));background:var(--lang);color:#fff;border-radius:16px;padding:14px;box-shadow:var(--shadow);text-align:left}
.pop.locked{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.pop::before{content:"";position:absolute;left:calc(50% + var(--x,0px));top:-7px;width:14px;height:14px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.pop.locked::before{border-left:2px solid var(--line);border-top:2px solid var(--line);top:-9px}
.pop h4{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 2px}
.pop p{margin:0 0 12px;font-weight:700;opacity:.9;font-size:14px}
.pop .btn{--c:#fff;--cd:rgba(0,0,0,.2);--ci:var(--lang);width:100%}

/* list views */

/* onboarding */
.onb{max-width:760px;margin:0 auto;padding:32px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));text-align:center}

.l-top .x svg{width:26px;height:26px}

.l-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:14px;color:var(--lang)}
.l-tag.retry{color:var(--bad)}
.combo{color:var(--flame);display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-weight:600;font-size:15px;margin-left:auto;animation:pop .3s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.l-q{font-size:clamp(22px,4vw,28px)}
.prompt{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.prompt .word{font-family:var(--display);font-weight:600;font-size:clamp(30px,7vw,44px);line-height:1.1;overflow-wrap:anywhere}
.prompt .sent{font-weight:800;font-size:21px;border:2px solid var(--line);border-radius:16px;padding:10px 14px;background:var(--surface);position:relative}
.translit{color:var(--muted);font-weight:700;font-size:16px;display:block;margin-top:2px}
.speak{border:0;background:var(--lang);color:#fff;width:56px;height:52px;border-radius:14px;box-shadow:0 4px 0 var(--lang-dark);display:grid;place-items:center;flex:none}

.opt{display:flex;align-items:center;gap:12px;border:2px solid var(--line-2);border-bottom-width:5px;background:var(--surface);border-radius:16px;padding:14px 16px;text-align:left;font-weight:800;font-size:18px;min-height:60px}

.opt[aria-pressed="true"] .k{border-color:var(--lang);color:var(--lang)}

.intro{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:26px;display:grid;gap:14px;justify-items:center;text-align:center}

.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pairs .col{display:grid;gap:12px;align-content:start}
.ptile{border:2px solid var(--line-2);border-bottom-width:5px;background:var(--surface);border-radius:14px;padding:12px;font-weight:800;font-size:17px;min-height:58px;overflow-wrap:anywhere}
.ptile[aria-pressed="true"]{border-color:var(--lang);color:var(--lang);background:color-mix(in srgb,var(--lang) 12%,var(--surface))}
.ptile.matched{border-color:var(--line);color:var(--locked-ink);background:var(--surface-2);border-bottom-width:2px;opacity:.6;cursor:default}
.ptile.miss{border-color:var(--bad);color:var(--bad-ink);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.answer-line{min-height:118px;border-bottom:2px solid var(--line-2);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:8px 0;
  background:repeating-linear-gradient(to bottom,transparent 0 56px,var(--line) 56px 58px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.wt{border:2px solid var(--line-2);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:800;font-size:17px;line-height:1.2}
@media (hover: hover) and (pointer: fine){.wt:hover{background:var(--surface-2)}}
.wt.used{background:var(--surface-2);color:transparent;border-color:var(--surface-2);cursor:default}
.type-in{width:100%;min-height:120px;border:2px solid var(--line-2);border-radius:16px;background:var(--surface);padding:14px 16px;font-size:20px;font-weight:700;resize:none}
.type-in:focus{border-color:var(--lang);outline:0}
.hint-btn{align-self:flex-start}
.l-foot{border-top:2px solid var(--line);background:var(--bg);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.l-foot.ok{background:var(--ok-soft);border-color:transparent}
@media (prefers-reduced-motion:no-preference){
  .l-foot.ok.fresh{animation:footup .38s cubic-bezier(.2,1.35,.45,1)}
  .l-foot.ok.fresh .mark{position:relative;animation:markpop .5s cubic-bezier(.2,1.7,.4,1) both}
  .l-foot.ok.fresh .mark::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--ok);animation:ring .7s ease-out .12s both;pointer-events:none}
  .l-foot.ok.fresh h3{animation:praise .45s cubic-bezier(.2,1.5,.4,1) .08s both}
  .l-foot.ok.fresh .gain{display:inline-block;animation:gainup .8s ease-out .2s both}
  .l-in.won .answer-line .wt{animation:hop .5s cubic-bezier(.3,1.7,.5,1) both;animation-delay:calc(var(--k,0) * 55ms);border-color:var(--ok);color:var(--ok-ink);background:var(--ok-soft)}
  .l-in.won .opt.right{animation:hop .5s cubic-bezier(.3,1.7,.5,1) both}
}
@keyframes footup{from{transform:translateY(100%)}}
@keyframes markpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:none}}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(2.1);opacity:0}}
@keyframes praise{from{opacity:0;transform:translateX(-10px) scale(.9)}}
@keyframes gainup{0%{opacity:0;transform:translateY(12px) scale(.5)}55%{opacity:1;transform:translateY(-6px) scale(1.25)}100%{transform:none}}
@keyframes hop{0%{transform:none}40%{transform:translateY(-10px) scale(1.06)}100%{transform:none}}
.l-foot.bad{background:var(--bad-soft);border-color:transparent}
.l-foot-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.fb{display:flex;align-items:center;gap:14px;min-width:0;flex:1}

/* pronunciation */

.mic{--c:var(--lang);--cd:var(--lang-dark);border:0;width:112px;height:104px;border-radius:32px;background:var(--c);color:#fff;box-shadow:0 7px 0 var(--cd);display:grid;place-items:center;position:relative;transition:transform .06s,box-shadow .06s}

.mic.on{--c:var(--heart);--cd:#b8293f}
.mic.on::after{content:"";position:absolute;inset:-10px;border-radius:40px;border:4px solid color-mix(in srgb,var(--heart) 45%,transparent);animation:pulse 1.2s ease-out infinite}
.mic.small{width:56px;height:52px;border-radius:16px;box-shadow:0 4px 0 var(--cd)}

.mic-label{font-weight:800;color:var(--muted)}
.score{display:flex;align-items:center;gap:12px;width:min(320px,100%)}
.score b{font-family:var(--display);font-size:30px;min-width:76px;text-align:right}

.ab-quiz .ab-glyph{margin:6px 0}
.ab-hear{align-self:center;display:grid;place-items:center;width:110px;height:110px;border-radius:24px;border:0;border-bottom:5px solid var(--lamp-dark);background:var(--lamp);color:var(--lamp-ink)}
.ab-hear svg{width:52px;height:52px}
.ab-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ab-opt{border:2px solid var(--line-2);border-bottom-width:4px;border-radius:14px;background:var(--surface);color:var(--ink);padding:16px 8px;font:800 20px var(--body)}
.ab-opt.glyph{font-weight:500;font-size:30px;letter-spacing:.06em}
.ab-opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.ab-opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--surface));color:var(--bad)}
.ab-opt.dim{opacity:.5}
.ab-fb{display:grid;gap:12px;margin-top:auto;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.ab-fb.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.ab-fb b{color:var(--ok)}.ab-fb.bad b{color:var(--bad)}
.ab-end{display:grid;gap:10px;justify-items:center;text-align:center}
.ab-big{font-size:56px}
/* friends */
.fr-wait{text-align:center;color:var(--muted);font-weight:700}
.fr-err{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-color:var(--bad)}
.fr-err-t{color:var(--bad);font-weight:700;margin:0 0 10px}
.fr-me{display:flex;gap:14px;align-items:center}
.fr-me>div{flex:1;min-width:0}
.fr-me p{margin:2px 0 0;font-size:13px}
.fr-code{font-family:var(--display);font-size:26px;letter-spacing:.18em;color:var(--lamp)}
.fr-av{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;background:var(--surface-2);font-size:24px}
.fr-av.big{width:62px;height:62px;font-size:34px;border:3px solid var(--lamp)}
.fr-row{display:flex;gap:8px}
.fr-in{flex:1;min-width:0;width:100%;border:2px solid var(--line-2);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font:600 16px var(--body)}
.fr-in:focus{outline:none;border-color:var(--lamp)}
#frCode{text-transform:uppercase;letter-spacing:.15em;font-family:var(--display)}
.fr-person{display:flex;gap:12px;align-items:center;width:100%;padding:10px 4px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:left;position:relative}
.fr-person:first-of-type{border-top:0}
.fr-person>div{flex:1;min-width:0}
.fr-person b{display:block}
.fr-person small{display:block;font-weight:700}
.fr-ok{color:var(--ok);font-weight:700}
.fr-fire{display:inline-flex;align-items:center;gap:2px;color:var(--flame);font-weight:800}
.fr-fire svg{width:18px;height:18px}
.fr-duo{font-weight:800;color:var(--lamp)}
.fr-badge{position:absolute;left:34px;top:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font:800 11px/18px var(--body);font-style:normal;text-align:center}
.fr-sent{font-size:13px;margin:10px 0 0}
.fr-out{align-self:center;font-size:13px}
.fr-list{margin:0 0 14px;padding-left:18px;color:var(--muted);font-weight:700;display:grid;gap:4px}
.fr-lbl{display:block;font-weight:800;margin:12px 0 6px}
.fr-avs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
.fr-avpick{aspect-ratio:1;border:2px solid var(--line-2);background:var(--surface-2);border-radius:12px;font-size:24px}
.fr-avpick[aria-pressed="true"]{border-color:var(--lamp);background:color-mix(in srgb,var(--lamp) 20%,var(--surface))}
.fr-fine{font-size:13px;margin:10px 0 0;text-align:center}
.fr-chat{display:flex;flex-direction:column;gap:12px}
.fr-top{display:flex;gap:10px;align-items:center}
.fr-top>div{flex:1;min-width:0}
.fr-top b{display:block}
.fr-top small{display:flex;align-items:center;gap:3px;font-weight:700}
.fr-top small svg{width:14px;height:14px;color:var(--flame)}
.fr-top .x{border:0;background:none;color:var(--muted);padding:6px}
.fr-top .x svg{width:24px;height:24px}
.fr-top .linkish{font-size:12px}
.fr-duocard{display:flex;gap:14px;align-items:center;background:var(--paper);color:var(--paper-ink);border:2px solid var(--paper-edge);border-radius:16px;padding:12px 14px}
.fr-duo-n{display:grid;justify-items:center;line-height:1}
.fr-duo-n span{font-size:22px}
.fr-duo-n b{font-family:var(--display);font-size:30px}
.fr-duo-n small{font-weight:800;font-size:11px}
.fr-mission{flex:1;display:grid;gap:4px}
.fr-mission small{font-weight:700}
.fr-mission .bar{height:10px;border-radius:5px;background:color-mix(in srgb,var(--paper-ink) 15%,transparent);overflow:hidden}
.fr-mission .bar i{display:block;height:100%;background:var(--lamp-dark);border-radius:5px}
.fr-mission .btn{justify-self:start}
.fr-msgs{display:flex;flex-direction:column;gap:8px;min-height:180px;max-height:min(52vh,460px);overflow-y:auto;padding:4px 2px;overscroll-behavior:contain}
.fr-empty{text-align:center;margin:auto 0;font-weight:700}
.fr-msg{max-width:80%;align-self:flex-start;background:var(--surface-2);border-radius:16px 16px 16px 4px;padding:8px 12px}
.fr-msg.me{align-self:flex-end;background:color-mix(in srgb,var(--lamp) 22%,var(--surface));border-radius:16px 16px 4px 16px}
.fr-msg.doubt{border:2px solid var(--lamp)}
.fr-msg p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.fr-msg time{display:block;text-align:right;font-size:11px;color:var(--muted);font-weight:700}
.fr-tag{display:block;font-size:12px;font-weight:800;color:var(--lamp);margin-bottom:2px}
.fr-nudge{align-self:center;font-size:13px;font-weight:800;color:var(--muted);background:var(--surface);border:1px dashed var(--line-2);border-radius:20px;padding:4px 12px}
.fr-quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.fr-quick .chip{white-space:nowrap;font-size:13px;padding:6px 10px}
.fr-send{display:flex;gap:6px;align-items:flex-end}
.fr-send textarea{resize:none;max-height:120px}
.fr-dbt{font-size:18px;padding:6px 10px;line-height:1.2}
.fr-send .fr-in{padding:9px 12px;line-height:1.3}
.fr-dbt[aria-pressed="true"]{border-color:var(--lamp);color:var(--lamp)}
.tw.on{background:color-mix(in srgb,var(--lamp) 55%,transparent);border-bottom-color:transparent}
@media (hover: hover) and (pointer: fine){.tw:hover{background:color-mix(in srgb,var(--lamp) 25%,transparent)}}
.vn-en{margin:2px 0 0;font-size:21px;font-weight:800;line-height:1.3}
.vn-q{margin:0;font-weight:800;color:var(--muted)}
.vn-opts .opt{font-size:17px;min-height:54px}
.vn-me{justify-self:end}
.thought{position:relative;background:var(--surface-2);border:2px dashed var(--line-2);border-radius:18px;padding:12px 14px;font-weight:700;line-height:1.45}
.thought b{display:block;color:var(--xp);font-family:var(--display);font-weight:600;text-transform:uppercase;font-size:13px;letter-spacing:.05em}
.thought::before{content:"";position:absolute;left:22px;top:-12px;width:12px;height:12px;border-radius:50%;background:var(--surface-2);border:2px dashed var(--line-2)}
.coin-loss{margin:0;color:var(--bad-ink);font-weight:800;display:flex;align-items:center;gap:4px}
.ok-note{margin:0;color:var(--ok);font-weight:800}
.objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.obj{display:grid;justify-items:center;gap:4px;border:2px solid var(--line-2);border-bottom-width:5px;background:var(--surface);border-radius:16px;padding:12px 6px;font-weight:800}
.obj .oi{font-size:34px;line-height:1}
.obj.seen{border-color:var(--ok);color:var(--ok)}
.obj.wrong{border-color:var(--bad);color:var(--bad-ink);animation:shake .35s}
.obj-card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:18px}
.obj-card p{flex-basis:100%;margin:0;font-size:15px;font-weight:700}
.obj-card .speak{width:44px;height:40px}
.purse{display:flex;flex-wrap:wrap;gap:8px}
.coin{width:48px;height:48px;border-radius:50%;border:0;background:var(--surface-2);color:var(--coin);display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.coin.on{background:var(--coin);color:#fff;transform:translateY(-6px)}
.hand{margin:0;font-weight:800}
.memory{display:grid;justify-items:center;gap:8px;text-align:center;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:22px}
.mem-glow{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;color:#ffe08a;background:radial-gradient(circle,#7a5a12,#2b2110);animation:glow 1.6s ease-out infinite}
.mem-glow svg{width:48px;height:48px}
.mem-word{font-family:var(--display);font-size:40px}
.purse-n{display:flex;align-items:center;gap:4px;color:var(--coin);font-family:var(--display);font-weight:600;font-size:18px}
.purse-n svg{width:22px;height:22px}
.bag-btn{border:0;background:var(--surface-2);color:var(--ink);border-radius:12px;height:40px;padding:0 10px;display:flex;align-items:center;gap:4px;font-family:var(--display)}
.bag-btn svg{width:22px;height:22px}
.vn-foot{justify-content:flex-end}
.vn-foot .talk-foot{display:flex;align-items:center;gap:14px;margin:0 auto}
.vn-foot .talk-foot .mic{width:84px;height:78px;border-radius:26px}
.vn-foot .talk-foot .mic-label{position:static;display:inline}
.bag-card{display:flex;align-items:center;gap:12px;text-align:left;width:100%;color:var(--ink)}
.bag-card .grow{flex:1}.bag-card b{display:block;font-size:17px}.bag-card small{color:var(--muted);font-weight:700}
.bag-list{display:grid;gap:10px;max-height:60vh;max-height:60dvh;overflow:auto;overscroll-behavior:contain}
.bag-item{display:flex;gap:12px;align-items:flex-start;border-top:2px solid var(--line);padding-top:10px}
.bag-item .oi{font-size:32px}.bag-item .grow{flex:1;min-width:0}.bag-item p{margin:4px 0 0;font-weight:700}
.bag-acts{display:flex;gap:6px}
.phrases{text-align:left;display:grid;gap:8px}
.phrases h3{margin:0}
.ph-row{display:flex;gap:10px;align-items:center}
.ph-row small{display:block;color:var(--muted);font-weight:700}
.phrases .btn{justify-self:start}
.only-phone{display:none}
@media (max-width:760px){ .nav button[data-v="ach"]{display:none} .only-phone{display:flex} .actor span{width:76px;height:76px;font-size:36px} }

/* notebook */
.nav .ns{display:none}
.nav .nav-more{display:none}
@media (max-width:760px){ .nav .nav-more{display:flex} }
.more-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.more-item{position:relative;display:grid;justify-items:center;gap:6px;padding:14px 6px;border:2px solid var(--line-2);border-bottom-width:4px;border-radius:14px;background:var(--surface);color:var(--ink);font-weight:800;font-size:14px}
.more-item svg{width:28px;height:28px;color:var(--lamp)}
.more-item[aria-current="page"]{border-color:var(--lamp);background:color-mix(in srgb,var(--lamp) 14%,var(--surface))}
.more-item .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--bad)}
.nb-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.nb-tab{display:flex;align-items:center;gap:8px;border:2px solid var(--line-2);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:6px 10px 6px 6px;font-weight:800;color:var(--ink)}
.nb-tab.on{border-color:var(--bc);color:var(--bc)}
.book{background:var(--surface);border:2px solid var(--line);border-left:10px solid var(--bc);border-radius:18px;padding:16px;display:grid;gap:12px;margin-bottom:16px}
.book-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--display);font-size:18px}
.book-head .muted{font-size:14px;font-weight:700}
.leaf{--paper:#fffdf6;--rule:#d9e3f0;--margin:#f2a7a7;--pen:#1f2a44;background:var(--paper);border-radius:6px 14px 14px 6px;box-shadow:0 2px 0 rgba(0,0,0,.06),0 10px 24px -14px rgba(0,0,0,.35);padding:12px 14px 10px 46px;position:relative;transform-origin:left center}
.leaf::before{content:"";position:absolute;top:0;bottom:0;left:34px;width:2px;background:var(--margin)}
.leaf.turn{animation:leafturn .45s ease-out}
@keyframes leafturn{from{transform:perspective(1200px) rotateY(-28deg);opacity:.4}to{transform:none;opacity:1}}
.leaf-top,.leaf-foot{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:#8a94a6}
.leaf-foot{justify-content:center;margin-top:4px}
textarea.lines{display:block;width:100%;height:512px;resize:none;overflow:hidden;border:0;outline:0;background-color:transparent;
  font-family:inherit;font-weight:600;font-size:18px;line-height:32px;color:var(--pen);padding:0;margin:0;box-sizing:border-box;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);background-attachment:local;overflow-wrap:break-word;white-space:pre-wrap}
textarea.lines::placeholder{color:#a3acbb}
#noteMeasure{position:absolute;left:-9999px;top:0;visibility:hidden}
.book-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.book-nav .say:disabled{opacity:.35}
.leaf-acts{display:flex;flex-wrap:wrap;gap:8px}
.nb-more p{margin:4px 0 12px}
.set-row.voices{display:grid;gap:10px}
.voice-row{display:flex;align-items:center;gap:10px}
.voice-row select{flex:1;min-width:0;border:2px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink);padding:8px;font:inherit;font-weight:700}
@media (max-width:760px){ .nav .nl{display:none} .nav .ns{display:inline} .leaf{padding-left:34px} .leaf::before{left:24px} textarea.lines{font-size:17px} }

/* responsive */
@media (max-width:1100px){
  .shell{grid-template-columns:200px minmax(0,1fr)}
  .side{display:none}
  .only-narrow{display:block}
}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr);padding-bottom:110px;gap:0}
  .nav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;flex-direction:row;justify-content:space-around;background:var(--bg);border-top:2px solid var(--line);
    padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));gap:0}
  .nav button{flex-direction:column;gap:3px;padding:6px 2px;font-size:11px;flex:1 1 0;min-width:0;align-items:center;letter-spacing:.02em}
  .nav button:not([data-v="home"],[data-v="learn"],[data-v="train"],[data-v="story"],[data-v="more"]){display:none}
  .nav .dot{position:absolute;margin:0;transform:translate(14px,-2px)}
  .nav button{position:relative}
  .logo span{display:none}
  .toasts{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:420px){
  .top-in{gap:6px}
  .stat{padding:5px 4px;font-size:16px;gap:3px}
  .stat svg{width:19px;height:19px}
  .lang-btn .lname{display:none}
  .unit-banner{flex-direction:column;align-items:flex-start}
  .l-foot .btn{width:100%}
  .fb .mark{width:44px;height:44px}
}

/* Lanterna: what people say is written on cream paper, like the dialogue boxes of an old RPG */
.vn-line,.vn-nar,.bub.npc{background:var(--paper);color:var(--paper-ink);border:0;box-shadow:0 4px 0 var(--paper-edge)}
.vn-line{border-left:6px solid var(--ac);border-radius:8px}
.vn-line.upset{border-left-color:var(--bad)}
.vn-nar{border-radius:8px}
.vn-name,.bub.npc .who{color:var(--paper-name)}
.vn-line .say,.bub.npc .say{background:#e4d8bd;color:#3a55b8}
.vn-line .linkish,.bub.npc .linkish,.vn-line .muted,.bub.npc .muted{color:#6d5f86}
.start-tag{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp-dark)}
.node-wrap:has(.node.current) .start-tag{bottom:calc(100% + 24px)}  /* clears the lamp ring */
.start-tag::after{background:var(--lamp);border-color:var(--lamp-dark)}
/* the lamp ring is a true circle around the whole button, its 3D base included (72 wide, 66 + 7 tall) */
.node.current::before{content:"";position:absolute;left:-9px;right:-9px;top:-11px;bottom:-16px;border-radius:50%;border:3px solid var(--lamp);box-shadow:0 0 12px rgba(246,197,96,.35);pointer-events:none}
.node.current::after{left:-15px;right:-15px;top:-17px;bottom:-22px}
.node.done,.node.chest.ready{color:var(--lamp-ink)}
.logo{letter-spacing:0}

/* motion: one set of curves for the whole app (strong ease-out for things that appear, iOS sheet curve for panels) */
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease-in-out:cubic-bezier(.77,0,.175,1);--ease-drawer:cubic-bezier(.32,.72,0,1)}
/* every tappable thing answers the finger: tiles sink a little, small buttons shrink a little */
.opt,.ptile,.wt,.ex,.obj,.chip,.coin,.talk-row,.lang-btn,.stat,.nav button,.guide-btn,.l-top .x,.lang-menu button,.linkish,.bag-btn,.sy-pause,.say,.switch{
  transition:transform 160ms var(--ease-out),background-color 150ms ease,border-color 150ms ease,color 150ms ease}
.opt:active:not(:disabled),.ptile:active:not(:disabled),.wt:active:not(:disabled),.ex:active,.obj:active:not(:disabled){transform:translateY(2px)}
.chip:active,.coin:active:not(:disabled),.talk-row:active,.lang-btn:active,.stat:active,.nav button:active,.guide-btn:active,.l-top .x:active,
.lang-menu button:active,.linkish:active,.bag-btn:active,.sy-pause:active,.say:active{transform:scale(.95)}
.coin.on:active:not(:disabled){transform:translateY(-6px) scale(.95)}
.speak{transition:transform 80ms,box-shadow 80ms}
.switch::after{transition:transform 200ms var(--ease-out)}
.bar i{transition:width .5s var(--ease-out)}
/* menus grow from the button that opened them; windows from the middle */
@keyframes popin{from{opacity:0;scale:.96}}
.lang-menu{transform-origin:top left;animation:popin 160ms var(--ease-out) both}
.pop{transform-origin:top center;animation:popin 180ms var(--ease-out) both}
.modal:not([hidden]){animation:fadein 200ms ease both}
.modal-box{animation:popin 240ms var(--ease-out) both}
.toast,.rw{animation-timing-function:var(--ease-out)}
/* the lesson opens like a sheet from below */
@keyframes sheetin{from{opacity:0;translate:0 28px}}
.lesson:not([hidden]){animation:sheetin 320ms var(--ease-drawer) both}
/* a new step slides in, one piece after the other; tapping inside the same step moves nothing */
@property --d{syntax:"<time>";inherits:false;initial-value:0ms}  /* each piece keeps its own delay */
@keyframes stepin{from{opacity:0;translate:0 10px}}
.l-in.fresh:not(.vn):not(.talk) > *,.l-in.fresh .vn-box > *,.l-in.talk.fresh .chat > .bub:last-child,.l-in.talk.fresh .your-turn{animation:stepin 280ms var(--ease-out) var(--d,0ms) both}
.l-in.fresh > :nth-child(2),.l-in.fresh .vn-box > :nth-child(2){--d:40ms}
.l-in.fresh > :nth-child(3),.l-in.fresh .vn-box > :nth-child(3){--d:80ms}
.l-in.fresh > :nth-child(4),.l-in.fresh .vn-box > :nth-child(4){--d:120ms}
.l-in.fresh > :nth-child(n+5),.l-in.fresh .vn-box > :nth-child(n+5){--d:160ms}
.l-in.talk .bub{animation:none}
.l-foot.fresh .l-foot-in{animation:stepin 240ms var(--ease-out) both}
.stage.same .lay.hd,.stage.same .actor:not(.enter){animation:none}
/* less motion asked: nothing slides or bounces, but things still fade in so changes are not abrupt */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}
  .modal:not([hidden]),.modal-box,.toast,.lesson:not([hidden]),.l-in.fresh:not(.vn):not(.talk) > *,.l-in.fresh .vn-box > *,.l-foot.fresh .l-foot-in,.lang-menu,.pop{animation:fadein 180ms ease both!important}
  .opt,.ptile,.wt,.chip,.talk-row,.nav button,.stat{transition:background-color 150ms ease,border-color 150ms ease,color 150ms ease!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-in">
      <span class="logo" id="logo"></span>
      <div class="lang-wrap">
        <button id="langBtn" class="lang-btn" data-act="langMenu" aria-haspopup="true" aria-expanded="false"></button>
        <div id="langMenu" class="lang-menu" hidden></div>
      </div>
      <div class="stats" id="stats"></div>
    </div>

const I = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

// ---------- state ----------
const KEY = "babel-save-v1"; // name from before the app was renamed; kept so saved progress survives
const fresh = () => ({
  v: 1, onboarded: false, lang: "en", view: "home", xp: 0, coins: 50, hearts: 5, heartsAt: Date.now(),
  streak: 0, bestStreak: 0, lastDay: null, freezes: 0, goal: 30, day: {}, boostUntil: 0,
  sound: true, translit: true, progress: {}, chests: {}, srs: {}, ach: {}, quests: {}, speech: {}, talks: {}, voicePick: {}, story: {}, bag: [], noMicUntil: 0, plan: {}, coop: {}, abc: {}, placed: {}, skill: {}, week: {},
  stats: { lessons: 0, perfect: 0, maxCombo: 0, reviews: 0, langs: {}, correct: 0, answered: 0, owl: false, early: false, chests: 0, spoken: 0, spokenGreat: 0, speechTests: 0, talks: 0, story: 0 },
});
let S = fresh();
try {
  const raw = JSON.parse(localStorage.getItem(KEY) || "null");
  if (raw && typeof raw === "object") { S = Object.assign(fresh(), raw); S.stats = Object.assign(fresh().stats, raw.stats || {}); }
} catch {}
if (!LANGS[S.lang]) S.lang = "en";
if (!S.homeSeen) { S.view = "home"; S.homeSeen = true; }  // saves from before the Início page open on it once
function save() { S.savedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} cloudSoon(); }
// Notes live under their own key, so "Apagar progresso" never touches them. They go only when the learner
// deletes a page or the whole notebook of a language.
const NOTES_KEY = "xibolete-notes-v1";
let NOTES = {};
try { const raw = JSON.parse(localStorage.getItem(NOTES_KEY)); if (raw && typeof raw === "object") NOTES = raw; } catch {}
function saveNotes(quiet) { if (!quiet) { S.notesAt = Date.now(); save(); } try { localStorage.setItem(NOTES_KEY, JSON.stringify(NOTES)); return true; } catch { return false; } }
// ask the browser not to clear this site's storage when the disk gets full
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
function today() {
  const k = dkey();
  if (!S.day[k]) {
    S.day[k] = { xp: 0, lessons: 0, perfect: 0, combo: 0, reviews: 0, spoken: 0 };
    const cut = dayOffset(-40);
    for (const d of Object.keys(S.day)) if (d < cut) delete S.day[d];
    for (const d of Object.keys(S.quests)) if (d < cut) delete S.quests[d];
  }
  return S.day[k];
}

// ---------- daily time goal ----------
// Each language has its own plan: why the learner studies it, how much they already know and how many
// minutes a day they want to give it. Study time counts while a lesson, talk, story, the speaking page or
// the notebook is open, the app is on screen and the learner touched it in the last 90 seconds (an app
// left open on the table does not count).
const GOAL_MINS = [[5, "Leve"], [10, "Regular"], [15, "Sério"], [20, "Intenso"]];
const GOAL_XP = { 5: 10, 10: 30, 15: 50, 20: 70 };  // the "earn X XP" quest grows with the time goal
const goalMin = (k = S.lang) => (S.plan[k] && S.plan[k].min) || 10;
const studySec = (k = S.lang, d = today()) => (d.sec && d.sec[k]) || 0;
let lastTouch = Date.now();
for (const e of ["pointerdown", "keydown"]) addEventListener(e, () => { lastTouch = Date.now(); }, { passive: true, capture: true });
setInterval(() => {
  if (!S.onboarded || document.hidden || Date.now() - lastTouch > 90e3) return;
  const busy = !$("#lesson").hidden || ["speak", "notes", "abc"].includes(S.view) && $("#onb").hidden;
  if (!busy) return;
  const k = typeof SY !== "undefined" && SY ? SY.l : S.lang, d = today(), had = studySec(k, d), goal = goalMin(k) * 60;
  (d.sec ||= {})[k] = had + 5;
  save();
  if (had < goal && had + 5 >= goal) { sfx("done"); toast(`Meta de hoje cumprida: ${goalMin(k)} min de ${LANGS[k].learning}!`, "flame"); }
  for (const g of claimWeek()) { sfx("done"); toast(`Marco da semana: ${esc(g.text)}. +${g.reward} moedas`, "star"); save(); renderChrome(); }
  document.querySelectorAll(".goal").forEach(g => { g.outerHTML = goalHtml(); });
}, 5000);

// ---------- course structure ----------
// Every unit: 3 lessons, then a speaking test that closes it (NL nodes in all).
const NL = 4;
function lessonsOf(lang, u) {
  const unit = LANGS[lang].units[u], w = unit.w, s = unit.s;
  const test = { name: "Prova de fala", w, s, size: 10, speech: true };
  if (unit.alpha) {
    const n = Math.ceil(w.length / 3);
    return [0, 1, 2].map(i => ({ name: `Letras, parte ${i + 1}`, w: w.slice(i * n, (i + 1) * n), s: [], alpha: true, size: i === 2 ? 12 : 10 })).concat(test);
  }
  const h = Math.ceil(w.length / 2), hs = Math.ceil(s.length / 2);
  return [
    { name: "Palavras novas", w: w.slice(0, h), s: [], size: 10 },
    { name: "Mais palavras e frases", w: w.slice(h), s: s.slice(0, hs), size: 10 },
    { name: "Desafio da unidade", w, s, size: 12, challenge: true },
    test,
  ];
}
const prog = lang => (S.progress[lang] ||= {});
const doneCount = (lang, u, l) => prog(lang)[`${u}-${l}`] || 0;
const isDone = (lang, u, l) => doneCount(lang, u, l) > 0;
function currentOf(lang) {
  const units = LANGS[lang].units;
  for (let u = 0; u < units.length; u++) for (let l = 0; l < NL; l++) if (!isDone(lang, u, l)) return { u, l };
  return null;
}
const unitDone = (lang, u) => isDone(lang, u, NL - 1);
function coursePct(lang) {
  const total = LANGS[lang].units.length * NL;
  let d = 0;
  LANGS[lang].units.forEach((_, u) => { for (let l = 0; l < NL; l++) if (isDone(lang, u, l)) d++; });
  return Math.round(d / total * 100);
}
const allWords = lang => LANGS[lang].units.flatMap((u, i) => u.w.map(w => Object.assign([...w], { unit: i, alpha: !!u.alpha })));

// Cyrillic → Latin letters, same style as the transliterations in data.js (yest, govoryu, kazhdy).
const RU_LAT = { а: "a", б: "b", в: "v", г: "g", д: "d", е: "e", ё: "yo", ж: "zh", з: "z", и: "i", й: "y", к: "k", л: "l", м: "m", н: "n", о: "o", п: "p", р: "r", с: "s", т: "t", у: "u", ф: "f", х: "kh", ц: "ts", ч: "ch", ш: "sh", щ: "shch", ъ: "", ы: "y", ь: "", э: "e", ю: "yu", я: "ya" };
function ruLat(t) {
  return first(t).replace(/[А-Яа-яЁё]+/g, w => {
    const l = w.toLowerCase().replace(/ый$/, "ы").replace(/ий$/, "и\u0001");
    let o = "";
    for (let i = 0; i < l.length; i++) o += l[i] === "\u0001" ? "y" : l[i] === "е" && (i === 0 || "аеёиоуыэюяьъ".includes(l[i - 1])) ? "ye" : RU_LAT[l[i]] ?? l[i];
    return w[0] !== w[0].toLowerCase() ? o[0].toUpperCase() + o.slice(1) : o;
  });
}
const latOf = (t, lang) => lang === "ru" && S.translit ? `<span class="translit">${esc(ruLat(t))}</span>` : "";

// ---------- story phrases in the review ----------
// Every phrase a finished story chapter taught goes into the same spaced repetition as the lesson words,
// so the Treino brings them back. They are marked .story and graded as sentences.
function storyPhrases(lang) {
  const st = (window.XIB_STORY || {})[lang];
  if (!st) return [];
  return st.chapters.filter(c => (S.story || {})[c.id] && c.phrases).flatMap(c => c.phrases.map(p =>
    Object.assign([p[0], p[1].replace(/\s*\([^)]*\)/g, "").trim(), lang === "ru" ? ruLat(p[0]) : undefined], { story: true })));
}
// phrases of finished chapters that are not in the review yet go in now (also for chapters finished before this existed)
function syncPhrases(lang) { for (const p of storyPhrases(lang)) if (!srs(lang, p).seen) srsHit(lang, p, true); }
const seenPhrases = lang => storyPhrases(lang).filter(p => srs(lang, p).seen);
const duePhrases = lang => seenPhrases(lang).filter(p => srs(lang, p).due <= Date.now()).sort((a, b) => srs(lang, a).s - srs(lang, b).s);
// the thing an exercise trains, for the spaced repetition: a word, or a story phrase
const srsOf = it => it.w || [it.s, it.src].find(x => x && x.story) || null;

// ---------- spaced repetition ----------
const wkey = (lang, w) => lang + ":" + w[0];
const srs = (lang, w) => S.srs[wkey(lang, w)] || { s: 0, due: 0, seen: 0 };
const INTERVAL_DAYS = [0, 1, 2, 4, 8, 16];
function srsHit(lang, w, ok) {
  const k = wkey(lang, w), r = Object.assign({ s: 0, due: 0, seen: 0 }, S.srs[k]);
  r.seen = 1;
  r.s = ok ? Math.min(5, r.s + 1) : Math.max(0, r.s - 2);
  r.due = Date.now() + (ok ? INTERVAL_DAYS[r.s] * 864e5 : 10 * 60e3);
  S.srs[k] = r;
}
const seenWords = lang => allWords(lang).filter(w => srs(lang, w).seen);
const learnedCount = lang => allWords(lang).filter(w => srs(lang, w).s >= 1).length;
const totalLearned = () => LKEYS.reduce((n, k) => n + learnedCount(k), 0);
const dueWords = lang => seenWords(lang).filter(w => srs(lang, w).due <= Date.now()).sort((a, b) => srs(lang, a).s - srs(lang, b).s);

// ---------- skills ----------
// Every real answer counts for one skill of the language it was given in, so the learner can see what is
// going well and what needs review. Kept per language in S.skill[lang][kind] = { n, ok, h }:
// n answers, ok right ones, h the last 30 as "1"/"0" (recent accuracy). It starts empty: nothing is guessed
// from before this existed.

function confetti(n = 140, at = null) {
  if (reduceMotion) return;
  const c = $("#confetti"), x = c.getContext("2d");
  const W = c.width = innerWidth * devicePixelRatio, H = c.height = innerHeight * devicePixelRatio;
  const ox = at ? at.x * devicePixelRatio : W / 2, oy = at ? at.y * devicePixelRatio : H * .35, sp = at ? .5 : 1;
  const cols = [getComputedStyle(document.documentElement).getPropertyValue("--lang").trim() || "#3d6ee8", "#f5b800", "#3aa935", "#ef3f5a", "#0ea5bd", "#ff7a1a"];
  const ps = Array.from({ length: n }, () => ({ x: ox + (at ? 0 : (Math.random() - .5) * W * .3), y: oy, vx: (Math.random() - .5) * 18 * sp * devicePixelRatio, vy: (-Math.random() * 16 * sp - 6 * sp) * devicePixelRatio, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, w: (6 + Math.random() * 6) * devicePixelRatio, h: (8 + Math.random() * 8) * devicePixelRatio, c: pick(cols) }));
  const t0 = performance.now();
  (function f(now) {
    x.clearRect(0, 0, W, H);
    const alive = now - t0 < (at ? 1400 : 2800);
    for (const p of ps) {
      p.vy += .45 * devicePixelRatio; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); x.restore();
    }
    if (alive) requestAnimationFrame(f); else x.clearRect(0, 0, W, H);
  })(t0);
}

// The study hub. The main action is always studying: the next lesson, or the review when many words are
// waiting. The story of the language comes beside it, as the place where those words are used, and every
// study tool is one tap away. Only real data is shown.
const HOME_REVIEW = 8;  // from this many items waiting, the review becomes the main action
const wordsOf = t => (first(t).toLowerCase().match(/[\p{L}\p{M}]+(?:['’-][\p{L}\p{M}]+)*/gu) || []);
// the chapter to show: the first one not finished yet (they open in order), or the last one when all are done
function storyNow(l) {
  const st = storyOf(l); if (!st) return null;
  const done = c => !!(S.story || {})[c.id];
  const k = st.chapters.findIndex(c => !done(c));
  return { st, ch: st.chapters[k < 0 ? st.chapters.length - 1 : k], k: k < 0 ? st.chapters.length - 1 : k, allDone: k < 0 };
}
// how many words of the chapter's phrases the learner has already met in lessons or reviews
function chapterWords(l, ch) {
  const all = new Set((ch.phrases || []).flatMap(p => wordsOf(p[0])).filter(w => w.length > 1));
  const seen = new Set(seenWords(l).flatMap(w => wordsOf(w[0])));
  return { n: all.size, known: [...all].filter(w => seen.has(w)).length };
}

const minsOf = d => { const x = S.day[d]; return x && x.sec ? Math.round(Object.values(x.sec).reduce((a, b) => a + b, 0) / 60) : 0; };
function myStats() {
  const min = {};
  for (let i = -13; i <= 0; i++) { const d = dayOffset(i), m = minsOf(d); if (m) min[d] = m; }
  const days = Object.keys(S.day).filter(d => S.day[d].xp > 0 || minsOf(d) >= 1).sort();
  return { streak: S.lastDay >= dayOffset(-1) ? S.streak : 0, last: S.lastDay, days, min, xp: S.xp, lv: lvl(S.xp).L, lang: S.lang, goal: goalMin() };
}

async function pushStats(force) {
  if (!NET || !FR.me) return;

  try { await sb(`profiles?id=eq.${NET.id}`, { method: "PATCH", body: { stats: st, updated_at: new Date().toISOString() } }); lastPush = j; FR.me.stats = st; } catch {}
}

function pairStreak(a, b) {

}

function paginate(full) {

  // conversations
  talkStart: d => startTalk(d.id),
  talkPt: d => { const e = TK.log.find(x => x.who === "npc" && x.step === +d.s); if (e) e.pt = !e.pt; renderTalk(); },

document.addEventListener("click", e => {
  if (!e.target.closest(".tw, .gloss")) closeGloss();
  const el = e.target.closest("[data-act]");
  if (!el) {
    if (!$("#langMenu").hidden && !e.target.closest(".lang-wrap")) $("#langMenu").hidden = true;
    if (pop && !e.target.closest(".pop")) { pop = null; render(); }
    return;
  }
  if (el.disabled) return;
  if (el.dataset.act !== "langMenu" && el.dataset.act !== "setLang") $("#langMenu").hidden = true;
  const fn = A[el.dataset.act];
  if (fn) fn(el.dataset, el);
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "frText") { e.preventDefault(); A.frSend(); return; }
  if (e.key === "Enter" && e.target.id === "frCode") { e.preventDefault(); A.frAdd(); return; }
  if (e.key === "Enter" && e.target.closest && e.target.closest(".acc-form")) { e.preventDefault(); A[e.target.closest(".acc-form").dataset.go](); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("tw")) { e.preventDefault(); e.target.click(); return; }
  if (!$("#modal").hidden) { if (e.key === "Escape") closeModal(); return; }
  if (SY) {
    if (e.key === "Escape") { SY.end ? closeStory() : A.syQuit(); return; }
    if (e.target.closest("button") && e.key === "Enter") return;
    if (SY.drill) { if (e.key === "Enter") { e.preventDefault(); canListen() ? A.syDrillMic() : drillNext(); } return; }
    const n = SY.end ? null : syNode();
    if (e.key === "Enter") {
      e.preventDefault();
      if (SY.end) closeStory();
      else if (n.choice && !SY.pick) A.syMic();
      else if (document.querySelector('[data-act="syNext"]')) syNext();
      return;
    }
    const k = parseInt(e.key, 10);
    if (n && n.choice && !SY.pick && k >= 1 && k <= n.choice.length && !SY.wrongs.has(k - 1)) A.syOpt({ i: k - 1 });
    return;
  }
  if (TK) {
    if (e.key === "Escape") { TK.mode === "talk" ? A.talkQuit() : closeTalk(); return; }
    if (e.key !== "Enter" || e.target.closest("button")) return;
    e.preventDefault();
    if (TK.mode === "end") closeTalk();
    else if (TK.mode === "shadow") A.shadowNext();
    else if (TK.fb) talkNext();
    else A.talkMic();
    return;
  }
  if (!LS) { if (e.key === "Escape") { $("#langMenu").hidden = true; if (pop) { pop = null; render(); } } return; }
  if (LS.finished) { if (e.key === "Enter") { e.preventDefault(); closeLesson(); } return; }
  const it = curItem(), typing = e.target.id === "typeIn";
  if (e.key === "Escape") { quitAsk(); return; }
  if (e.key === "Enter") {
    e.preventDefault();
    if (ungraded(it) || LS.state !== "answer") next();
    else if (it.k === "speak") { if (!selfMode(it)) A.mic(); }
    else check(false);
    return;
  }
  if (typing || LS.state !== "answer") return;
  const n = parseInt(e.key, 10);
  if (it.opts && n >= 1 && n <= it.opts.length) A.opt({ i: n - 1 });
  if (it.k === "build" || it.k === "buildRev") {
    if (e.key === "Backspace" && it.picked.length) { it.picked.pop(); renderLesson(); }
  }
});

// ---------- install as an app ----------
// Android/PC browsers offer an install prompt; on iPhone it's done by hand from Safari's share menu.
let installEvt = null;
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (S.view === "profile" && !LS && !TK && !SY) render(); });
window.addEventListener("appinstalled", () => { installEvt = null; toast("Xibolete instalado! Ele já está na sua tela inicial.", "star"); if (S.view === "profile") render(); });
function installRow() {
  const how = standalone() ? "Você já está usando o app instalado."
    : installEvt ? "Coloque o Xibolete na tela inicial e abra como um app, até sem internet."
    : isIOS() ? "No iPhone, abra este site no Safari, toque em Compartilhar (o quadrado com a seta para cima) e depois em “Adicionar à Tela de Início”."
    : "No Chrome ou no Edge, abra o menu do navegador e escolha “Instalar app” ou “Adicionar à tela inicial”.";
  return `<div class="set-row"><div><b>Instalar o app</b><p>${how}</p></div>${installEvt && !standalone() ? `<button class="btn small" data-act="install">Instalar</button>` : standalone() ? `<span class="chip">${I("check")}Instalado</span>` : ""}</div>`;
}
A.install = async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch {} installEvt = null; render(); };
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
// one gentle hint on phones that haven't installed it yet
if (S.onboarded && !standalone() && !S.installHint && matchMedia("(max-width:760px)").matches) {
  S.installHint = true; save();
  setTimeout(() => toast(`Dica: dá para instalar o Xibolete como app no celular. Veja como em <b>Perfil › Instalar o app</b>.`, "star"), 4000);
}

// ---------- boot ----------
const lastStudy = S.lastDay;  // read before a protector moves it to yesterday
checkStreak();
const weekGot = claimWeek(); if (weekGot.length) save();
regen();
if (S.onboarded) { const c = currentOf(S.lang); if (c && S.view === "learn" && !isDone(S.lang, 0, 0)) pop = `${c.u}-${c.l}`; }
LKEYS.forEach(syncPhrases);
if (S.onboarded && !S.plan[S.lang]) PL = { steps: ["why", "level", "goal", "ready"], i: 0, lang: S.lang };  // people who started before the plan existed answer once
render();
if (!PL && welcomeBack(lastStudy)) streakNotice = "";
if (streakNotice) toast(esc(streakNotice), "flame");
for (const g of weekGot) toast(`Marco da semana: ${esc(g.text)}. +${g.reward} moedas`, "star");
{ const inv = new URLSearchParams(location.search).get("amigo");
  if (inv) { FR.add = inv.toUpperCase().slice(0, 6); if (S.onboarded) { S.view = "friends"; render(); } history.replaceState(null, "", location.pathname); } }
frLoad();
if (S.onboarded && S.view === "learn") {
  const cur = document.querySelector(".node.current");
  cur && cur.scrollIntoView({ block: "center" });
}
setInterval(() => {
  const before = S.hearts; regen();
  if (!LS && (S.hearts !== before || document.visibilityState === "visible")) renderChrome();
}, 60e3);
})();
</script>
</body>
